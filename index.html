<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivory Arc Travels – Header</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #0a0a0a;
      --ivory: #f5f0e8;
      --gold:  #c9a84c;
    }

    body {
      background: var(--black);
      font-family: 'Cormorant Garamond', serif;
    }

    /* ── HEADER ── */
    header {
      background: var(--black);
      width: 100%;
      padding: 16px 0 14px;
    }

    /* ── INNER WRAPPER ── */
    .header-inner {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 0 5%;
      gap: 0;
    }

    /* ── LEFT: LOGO (30%) ── */
    .logo-block {
      width: 30%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .logo-block img {
      max-height: 88px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── SPACER (10%) ── */
    .spacer {
      width: 10%;
      flex-shrink: 0;
    }

    /* ── RIGHT: INFO (60%) ── */
    .info-block {
      width: 60%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    /* Operating since */
    .operating-since {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-style: normal;
      font-size: 13px;
      letter-spacing: 0.2em;
      color: var(--ivory);
      text-transform: uppercase;
    }

    /* Trusted label */
    .trusted-label {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--ivory);
      text-transform: uppercase;
      opacity: 0.8;
    }

    /* Partner logos row */
    .partner-logos {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /*
      mix-blend-mode: screen on a black parent background makes
      white/light backgrounds completely invisible — only the
      coloured logo artwork remains visible.
    */
    .logo-pill {
      background: #000;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      height: 32px;
    }

    .logo-pill img {
      height: 26px;
      width: auto;
      object-fit: contain;
      display: block;
      mix-blend-mode: screen;
    }

    /* Cert strip */
    .cert-strip {
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: 10.5px;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* ── RESPONSIVE: tablet ── */
    @media (max-width: 900px) {
      .logo-block img    { max-height: 70px; }
      .cert-strip        { font-size: 9px; letter-spacing: 0.16em; }
      .logo-pill         { height: 26px; padding: 2px 4px; }
      .logo-pill img     { height: 20px; }
    }

    /* ── RESPONSIVE: mobile ── */
    @media (max-width: 600px) {
      header { padding: 12px 0; }
      .header-inner {
        flex-direction: column;
        align-items: center;
        padding: 0 5%;
        gap: 12px;
      }
      .spacer { display: none; }
      .logo-block { width: 100%; justify-content: center; }
      .logo-block img { max-height: 65px; }
      .info-block { width: 100%; align-items: center; gap: 8px; }
      .cert-strip { font-size: 8.5px; letter-spacing: 0.13em; text-align: center; white-space: normal; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">

      <!-- LEFT: LOGO -->
      <div class="logo-block">
        <img
          src="https://ivoryarctravels.com/wp-content/uploads/2026/05/ChatGPT-Image-Jan-10-2026-09_54_20-AM-1.png"
          alt="Ivory Arc Travels"
        />
      </div>

      <!-- SPACER: the 10% breathing room -->
      <div class="spacer"></div>

      <!-- RIGHT: INFO -->
      <div class="info-block">

        <span class="operating-since">Operating since 2019</span>

        <span class="trusted-label">Trusted &amp; Verified By</span>

        <div class="partner-logos">
          <div class="logo-pill">
            <img
              src="https://ivoryarctravels.com/wp-content/uploads/2026/05/Screenshot-2026-05-28-at-10.54.26-AM.png"
              alt="Google"
            />
          </div>
          <div class="logo-pill">
            <img
              src="https://ivoryarctravels.com/wp-content/uploads/2026/05/Screenshot-2026-05-28-at-10.56.00-AM.png"
              alt="TripAdvisor"
            />
          </div>
          <div class="logo-pill">
            <img
              src="https://ivoryarctravels.com/wp-content/uploads/2026/05/Screenshot-2026-05-28-at-10.57.24-AM.png"
              alt="Viator"
            />
          </div>
        </div>

        <span class="cert-strip">
          GST Registered &nbsp;·&nbsp; MSME Certified &nbsp;·&nbsp; Govt. of India Recognised
        </span>

      </div>

    </div>
  </header>

</body>
</html>
