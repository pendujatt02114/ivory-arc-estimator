<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivory Arc Travels | Premium Estimator</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script>
  window.__ivoryMapsReady = function() {};

  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCSEJzPbWNptjtznWNncMmvutkklqkIXso&libraries=places&callback=__ivoryMapsReady">

<!-- Global error handler — shows real errors instead of "Script error." -->
<script>
window.addEventListener('error', function(e) {
  if (e.message === 'Script error.' || !e.message) return; // cross-origin noise
  console.error('App error:', e.message, 'at', e.filename, e.lineno);
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('Unhandled promise rejection:', e.reason);
});
</script>
<!-- Firebase loads on demand when OTP is needed -->
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9V72L72QVN"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-9V72L72QVN', { send_page_view: true });

// Ivory Arc custom event tracker
function iaTrack(eventName, params) {
  if (typeof gtag === 'function') {
    gtag('event', eventName, Object.assign({ event_category: 'estimator' }, params || {}));
  }
}
</script>
<style>
  :root {
    --gold:  #C9A96E;
    --ivory: #F5F0E8;
    --black: #0D0B08;
    --dark:  #1A1612;
    --green: #34D399;
    --red:   #F87171;
  }

  /* ── Base ── */
  body { font-family: 'DM Sans', sans-serif; }
  .ivory-arc-wrap { background: var(--black); color: var(--ivory); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6; padding: 20px; }
  .ivory-arc-wrap { display: block; }
  .ivory-arc-wrap .wrapper { max-width: 900px; margin: 0 auto; }

  /* ── Trust Strip ── */
  .trust-strip {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    border-bottom: 1.5px solid var(--gold); padding-bottom: 24px; margin-bottom: 30px;
  }
  .trust-heading { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ivory); }
  .trust-logos { display: flex; gap: 20px; align-items: center; }
  .logo-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--gold);
    border-radius: 6px; padding: 8px 14px; transition: background 0.2s;
  }
  .logo-badge:hover { background: rgba(201,169,110,0.12); }
  .logo-badge span { font-size: 12px; font-weight: 500; letter-spacing: 1.5px; color: var(--ivory); text-transform: uppercase; }
  .trust-certline { font-size: 11px; letter-spacing: 2px; color: var(--gold); }

  /* ── Section dividers ── */
  .section-head {
    font-size: 12px; color: var(--gold); margin: 40px 0 18px;
    text-transform: uppercase; letter-spacing: 2.5px;
    display: flex; align-items: center; gap: 14px;
  }
  .section-head::before, .section-head::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
  }

  /* ── Destination Grid / Cards ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
  .card {
    background: var(--dark); border: 0.5px solid var(--gold);
    padding: 16px; cursor: pointer; border-radius: 8px; transition: all 0.25s ease;
  }
  .card:hover { background: rgba(201,169,110,0.08); }
  .card.active { background: rgba(201,169,110,0.14); border-color: var(--gold); grid-column: 1 / -1; }
  .dest-name { font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; margin-bottom: 2px; color: #fff; }

  /* ── Days badge + stepper ── */
  .card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .days-badge {
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold);
    background: rgba(201,169,110,0.12); border: 1px solid var(--gold);
    border-radius: 20px; padding: 4px 12px;
  }
  .days-stepper { display: flex; align-items: center; border: 1px solid var(--gold); border-radius: 20px; overflow: hidden; }
  .days-stepper button {
    background: rgba(201,169,110,0.1); border: none; color: var(--gold);
    width: 30px; height: 30px; font-size: 16px; cursor: pointer; line-height: 1; transition: background 0.15s;
  }
  .days-stepper button:hover { background: rgba(201,169,110,0.28); }
  .days-stepper .days-val {
    min-width: 52px; text-align: center; font-size: 12px; font-weight: 500;
    color: var(--ivory); background: rgba(0,0,0,0.3); padding: 4px 4px;
  }

  /* ── Ancillaries ── */
  .anc-deck {
    margin-top: 16px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 8px; border-top: 1px solid var(--gold); padding-top: 16px;
  }
  .anc-row {
    background: rgba(0,0,0,0.35); padding: 10px 12px;
    border: 1px solid var(--gold); border-radius: 4px;
    font-size: 13px; font-weight: 400; color: var(--ivory);
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all 0.2s;
  }
  .anc-row:hover { background: rgba(201,169,110,0.12); }
  .anc-row .anc-price { color: var(--gold); font-weight: 500; white-space: nowrap; margin-left: 8px; }
  .anc-row.active { background: var(--gold); color: var(--black); font-weight: 600; border-color: var(--gold); }
  .anc-row.active .anc-price { color: var(--black); }

  /* ── Group Size Section ── */
  .group-context-bar {
    background: rgba(201,169,110,0.08); border: 1px solid var(--gold);
    border-radius: 8px; padding: 16px 22px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .gcb-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--ivory); margin-bottom: 4px; }
  .gcb-dest { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: #fff; }

  .tier-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 680px) { .tier-grid { grid-template-columns: repeat(2, 1fr); } }

  .tier-card {
    background: var(--dark); border: 1px solid var(--gold);
    border-radius: 8px; padding: 20px 14px 18px; cursor: pointer;
    transition: all 0.25s ease; text-align: center;
  }
  .tier-card:hover { background: rgba(201,169,110,0.08); }
  .tier-card.active { background: rgba(201,169,110,0.15); }
  .tier-label { font-size: 14px; font-weight: 500; color: var(--ivory); margin-bottom: 8px; }
  .tier-rate { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold); font-style: italic; margin-bottom: 4px; }
  .tier-rate-sub { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ivory); }

  /* Pax picker inside tier card */
  .pax-picker { margin-top: 14px; border-top: 1px solid var(--gold); padding-top: 12px; }
  .pax-picker-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ivory); margin-bottom: 10px; }
  .pax-options { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .pax-btn {
    background: transparent; border: 1px solid var(--gold);
    color: var(--ivory); font-size: 13px; font-weight: 500;
    padding: 6px 16px; border-radius: 20px; cursor: pointer; transition: all 0.15s;
  }
  .pax-btn:hover { background: rgba(201,169,110,0.15); }
  .pax-btn.active { background: var(--gold); color: var(--black); font-weight: 700; }

  /* No-selection hint */
  .group-no-dest {
    text-align: center; padding: 32px 20px;
    font-size: 13px; letter-spacing: 1.5px;
    color: var(--ivory); border: 1px dashed var(--gold); border-radius: 8px;
  }

  /* ── Guide Preferences ── */
  .guide-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px; align-items: stretch;
  }
  @media (max-width: 600px) { .guide-grid { grid-template-columns: 1fr; } }

  .guide-card {
    background: var(--dark); border: 1px solid var(--gold);
    border-radius: 8px; padding: 26px 18px 22px; cursor: pointer;
    transition: all 0.25s ease; text-align: center; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  .guide-card:hover { background: rgba(201,169,110,0.08); }
  .guide-card.guide-none { border-color: rgba(248,113,113,0.5); }

  /* selected states */
  .guide-card.guide-english.selected { background: rgba(201,169,110,0.1); border-color: var(--gold); }
  .guide-card.guide-none.selected    { background: rgba(248,113,113,0.08); border-color: var(--red); }
  .guide-card.guide-other.selected   { background: rgba(201,169,110,0.1); border-color: var(--gold); }

  /* selection dot */
  .guide-card.selected::after {
    content: ''; position: absolute; top: 12px; right: 12px;
    width: 8px; height: 8px; border-radius: 50%;
  }
  .guide-card.guide-english.selected::after,
  .guide-card.guide-other.selected::after   { background: var(--gold); }
  .guide-card.guide-none.selected::after    { background: var(--red); }

  .guide-icon { font-size: 28px; line-height: 1; margin-bottom: 14px; }

  .guide-title {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 18px; color: #fff; line-height: 1.3; margin-bottom: 16px;
    min-height: 50px; display: flex; align-items: center; justify-content: center;
  }

  /* Clean, readable pill badges — no heavy saturated fills */
  .guide-impact {
    font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    padding: 7px 18px; border-radius: 20px; margin-bottom: 12px;
    display: inline-block;
  }
  .guide-impact.incl  {
    background: transparent; color: var(--green);
    border: 1.5px solid var(--green);
  }
  .guide-impact.minus {
    background: transparent; color: var(--red);
    border: 1.5px solid var(--red);
  }
  .guide-impact.plus  {
    background: transparent; color: var(--gold);
    border: 1.5px solid var(--gold);
  }

  .guide-availability {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 14px;
  }

  .guide-caveat {
    margin-top: auto;
    font-size: 12px; line-height: 1.65; color: var(--ivory);
    padding: 12px 8px 0; border-top: 1px solid rgba(201,169,110,0.35);
    width: 100%; text-align: left;
  }

  /* ── Airport Services ── */
  .airport-intro {
    background: rgba(201,169,110,0.07); border: 1px solid var(--gold);
    border-radius: 8px; padding: 18px 22px; margin-bottom: 20px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .airport-intro-icon { font-size: 28px; flex-shrink: 0; margin-top: 2px; }
  .airport-intro-text { flex: 1; }
  .airport-intro-text strong {
    display: block; font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 17px; color: #fff; margin-bottom: 5px;
  }
  .airport-intro-text p { font-size: 13px; color: var(--ivory); line-height: 1.65; margin: 0 0 8px; }
  .airport-notice {
    font-size: 11px; color: var(--gold); letter-spacing: 0.3px;
    line-height: 1.55; border-top: 1px solid rgba(201,169,110,0.3);
    padding-top: 8px; margin-top: 2px;
  }

  .airport-services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 600px) { .airport-services-grid { grid-template-columns: 1fr; } }

  .airport-service-card {
    background: var(--dark); border: 1px solid var(--gold);
    border-radius: 8px; padding: 22px 18px 20px; cursor: pointer;
    transition: all 0.25s ease; display: flex; flex-direction: column;
    align-items: center; text-align: center; position: relative;
  }
  .airport-service-card:hover { background: rgba(201,169,110,0.08); }
  .airport-service-card.selected { background: rgba(201,169,110,0.14); }
  .airport-service-card.selected::after {
    content: '✓'; position: absolute; top: 10px; right: 13px;
    font-size: 14px; font-weight: 700; color: var(--gold);
  }

  .asc-icon { font-size: 26px; margin-bottom: 12px; }
  .asc-title {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 17px; color: #fff; line-height: 1.3; margin-bottom: 12px;
    min-height: 50px; display: flex; align-items: center; justify-content: center;
  }
  .asc-rate {
    font-size: 20px; font-family: 'Playfair Display', serif;
    font-style: italic; color: var(--gold); margin-bottom: 4px;
  }
  .asc-rate-sub { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ivory); margin-bottom: 0; min-height: 32px; display: flex; align-items: center; justify-content: center; }

  /* Everything above the separator sits in a fixed-height block */
  .asc-body {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; min-height: 160px; padding-bottom: 14px;
  }
  .asc-desc {
    margin-top: auto; font-size: 12px; line-height: 1.65; color: var(--ivory);
    padding: 10px 6px 0; border-top: 1px solid rgba(201,169,110,0.35);
    width: 100%; text-align: left;
  }

  /* ── Locked overlay for standard sections ── */
  .section-locked { position: relative; pointer-events: none; user-select: none; }
  .section-locked::after {
    content: 'Custom Journey Mode Active';
    position: absolute; inset: 0; z-index: 10;
    background: rgba(13,11,8,0.82);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(201,169,110,0.5); border-radius: 8px;
    backdrop-filter: blur(1px);
  }

  /* ── Custom Itinerary Toggle Banner ── */
  .custom-toggle-bar {
    background: rgba(201,169,110,0.06); border: 1px solid var(--gold);
    border-radius: 10px; padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  .custom-toggle-bar.active-mode { background: rgba(201,169,110,0.12); box-shadow: 0 0 28px rgba(201,169,110,0.1); }
  .ctb-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: #fff; margin-bottom: 4px; }
  .ctb-sub { font-size: 12px; color: var(--ivory); line-height: 1.55; }

  .toggle-wrap { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .toggle-lbl { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .toggle-switch { position: relative; width: 52px; height: 28px; cursor: pointer; display: inline-block; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(201,169,110,0.4); border-radius: 28px; transition: all 0.3s;
  }
  .toggle-track::before {
    content: ''; position: absolute; width: 20px; height: 20px;
    left: 3px; top: 3px; background: rgba(201,169,110,0.45);
    border-radius: 50%; transition: all 0.3s;
  }
  .toggle-switch input:checked + .toggle-track { background: rgba(201,169,110,0.2); border-color: var(--gold); }
  .toggle-switch input:checked + .toggle-track::before { transform: translateX(24px); background: var(--gold); }

  /* ── Custom Builder Panel ── */
  .custom-builder { background: var(--dark); border: 1px solid var(--gold); border-radius: 10px; padding: 28px 24px; margin-top: 16px; }

  .ci-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 600px) { .ci-row { grid-template-columns: 1fr; } }
  .ci-field { display: flex; flex-direction: column; gap: 6px; position: relative; }
  .ci-field label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .ci-field input, .ci-field textarea {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(201,169,110,0.45);
    border-radius: 6px; padding: 11px 14px; font-size: 14px; color: var(--ivory);
    font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s;
    width: 100%; box-sizing: border-box;
  }
  .ci-field input:focus, .ci-field textarea:focus { border-color: var(--gold); background: rgba(201,169,110,0.04); }
  .ci-field input::placeholder, .ci-field textarea::placeholder { color: rgba(245,240,232,0.28); }
  /* Kill ALL browser-injected icons: validation, password managers, autofill */
  .ci-field input::-ms-reveal,
  .ci-field input::-ms-clear,
  .ci-field input::-webkit-contacts-auto-fill-button,
  .ci-field input::-webkit-credentials-auto-fill-button,
  .ci-field input::-webkit-caps-lock-indicator,
  .ci-field input::-webkit-search-cancel-button,
  .ci-field input::-webkit-search-decoration { display: none !important; }
  .ci-field input:invalid { box-shadow: none; outline: none; }
  .ci-field textarea { resize: vertical; min-height: 68px; }

  .ac-dropdown {
    position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 9999;
    background: #1e1a16; border: 1px solid var(--gold); border-radius: 6px;
    max-height: 210px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .ac-item { padding: 10px 14px; font-size: 13px; color: var(--ivory); cursor: pointer; border-bottom: 0.5px solid rgba(201,169,110,0.12); transition: background 0.15s; }
  .ac-item:hover { background: rgba(201,169,110,0.12); }
  .ac-item:last-child { border-bottom: none; }
  .ac-main { font-weight: 500; }
  .ac-sub { font-size: 11px; color: rgba(201,169,110,0.65); margin-top: 2px; }

  .ci-options-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ci-chip {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(201,169,110,0.4);
    border-radius: 20px; padding: 8px 16px; cursor: pointer; transition: all 0.2s;
    font-size: 13px; color: var(--ivory); user-select: none;
  }
  .ci-chip:hover { border-color: var(--gold); }
  .ci-chip.active { background: rgba(201,169,110,0.15); border-color: var(--gold); color: #fff; }
  .ci-chip .chip-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid rgba(201,169,110,0.5); flex-shrink: 0; transition: all 0.2s; }
  .ci-chip.active .chip-dot { background: var(--gold); border-color: var(--gold); }

  .ci-calc-btn {
    width: 100%; padding: 14px; background: var(--gold); color: var(--black);
    border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    transition: all 0.2s; font-family: 'DM Sans', sans-serif; margin-top: 4px;
  }
  .ci-calc-btn:hover { background: #dbbf7e; }
  .ci-calc-btn:disabled { opacity: 0.38; cursor: not-allowed; background: var(--gold); }

  .ci-result { margin-top: 24px; border: 1px solid var(--gold); border-radius: 8px; overflow: hidden; }
  .ci-result-header { background: rgba(201,169,110,0.1); padding: 14px 20px; border-bottom: 1px solid rgba(201,169,110,0.25); }
  .ci-result-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; color: #fff; }
  .ci-result-route { font-size: 12px; color: var(--gold); margin-top: 3px; letter-spacing: 0.4px; }
  .ci-breakdown { padding: 16px 20px; }
  .ci-line { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 0.5px solid rgba(201,169,110,0.1); font-size: 13px; }
  .ci-line:last-child { border-bottom: none; }
  .ci-line-label { color: rgba(245,240,232,0.65); }
  .ci-line-val { color: var(--gold); font-weight: 500; }
  .ci-line.ci-subtotal { border-top: 1px solid rgba(201,169,110,0.2); margin-top: 6px; padding-top: 12px; }
  .ci-line.ci-subtotal .ci-line-label { color: var(--ivory); font-weight: 500; }
  .ci-line.ci-total { padding-top: 14px; border-top: 1px solid var(--gold); border-bottom: none; margin-top: 4px; }
  .ci-line.ci-total .ci-line-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: 18px; color: #fff; }
  .ci-line.ci-total .ci-line-val { font-family: 'Playfair Display', serif; font-style: italic; font-size: 28px; color: var(--gold); }
  .ci-disclaimer { padding: 12px 20px; font-size: 11px; color: var(--ivory); background: rgba(0,0,0,0.2); border-top: 1px solid rgba(201,169,110,0.15); line-height: 1.65; }
  .ci-loading { text-align: center; padding: 28px; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); }
  .ci-error { padding: 14px 18px; font-size: 13px; color: var(--red); background: rgba(248,113,113,0.06); border-radius: 6px; margin-top: 16px; border: 1px solid rgba(248,113,113,0.25); line-height: 1.55; }

  /* ── Travel Details / Calendar Gate ── */
  .td-gate-banner {
    background: rgba(201,169,110,0.07); border: 1px solid var(--gold);
    border-radius: 10px; padding: 22px 26px; margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .td-gate-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: #fff; margin-bottom: 4px; }
  .td-gate-sub   { font-size: 12px; color: var(--ivory); line-height: 1.55; }
  .td-gate-pill  {
    background: rgba(248,113,113,0.12); border: 1px solid var(--red);

  // ── Pricing Engine ────────────────────────────────────────────────────────
  function applyPricingLogic(googleKm, pickupName, dropName, nightHalt, isTwoWay) {
    var effectiveKm = isTwoWay ? googleKm * 2 : googleKm;
    // 1. Commercial buffer
    // Covers real-world deviations: hotel detours, rerouting, traffic jams,
    // wrong turns, customer stops, internal parking loops, route changes.
    let buffer;
    if (effectiveKm < 100)       buffer = 13;
    else if (effectiveKm < 300)  buffer = 33;
    else                         buffer = 55;
    const billableKm = effectiveKm + buffer;

    // 2. Distance charge @ ₹18/km on buffered distance
    // ₹18/km is an all-in rate covering fuel, driver wages, and vehicle cost.
    const distCharge = billableKm * 18;

    // 3. Toll estimate — heuristic based on NH average
    // Actual tolls billed at actuals with receipt.
    const tollPerHundred = 220;
    const toll = Math.round((billableKm * tollPerHundred / 100) / 50) * 50;

    // 4. Parking — charged at ACTUALS only, with receipt
    // Applicable at: airport, sightseeing stops, overnight halts.
    // Shown as "At Actuals" in estimate — no upfront charge collected.
    const parking = 0; // collected against receipt only

    // 5. Night halt
    const nightCost = nightHalt ? (isTwoWay ? 1600 : 800) : 0;

    // 6. Subtotal
    const subtotal = distCharge + toll + nightCost;

    // 7. GST 5% on subtotal
    const gst = Math.round(subtotal * 0.05);

    // 8. Final total (parking excluded — actuals only)
    const total = subtotal + gst;

    return { pickup: pickupName, drop: dropName, googleKm, effectiveKm: effectiveKm, buffer, billableKm,
             distCharge, toll, nightHalt, nightCost, isTwoWay: !!isTwoWay, subtotal, gst, total };
  }

  // ── Google Maps — full working implementation ────────────────────────────
  // Replace the value below with your actual Google Maps API key
  let acPickupTimer   = null;
  let acDropTimer     = null;
  let mapsApiLoaded   = false;
  let gmapsLoadCalled = false;

  // Called by the Maps JS API once it has fully loaded
  window.__ivoryMapsReady = function() {
    mapsApiLoaded = true;
    // If the custom builder is already visible, re-attach native autocomplete
    if (customMode) attachNativeAutocomplete();
  };

  function loadMapsApi() {
    // Maps script is loaded via a script tag in the page head.
    // This function intentionally left as a no-op.
    // If google.maps is already available, mark as loaded immediately.
    if (window.google && window.google.maps) {
      mapsApiLoaded = true;
      if (customMode) attachNativeAutocomplete();
    }
  }

  // ── Native google.maps.places.Autocomplete (most reliable approach) ───────
  // We attach one Autocomplete widget per input directly rather than using
  // AutocompleteService manually — this avoids the callback/status issues.
  let acPickupWidget = null;
  let acDropWidget   = null;

  function attachNativeAutocomplete() {
    const pickupEl = document.getElementById('ci-pickup');
    const dropEl   = document.getElementById('ci-drop');
    if (!pickupEl || !dropEl) return;
    if (!window.google || !google.maps || !google.maps.places) return;

    const opts = {
      componentRestrictions: { country: 'in' },
      fields: ['place_id', 'name', 'formatted_address', 'geometry']
    };

    // Pickup
    if (!acPickupWidget) {
      acPickupWidget = new google.maps.places.Autocomplete(pickupEl, opts);
      acPickupWidget.addListener('place_changed', () => {
        const p = acPickupWidget.getPlace();
        if (!p || !p.place_id) return;
        ciPickup        = p.name + (p.formatted_address ? ', ' + p.formatted_address : '');
        ciPickupPlaceId = p.place_id;
        ciPickupLatLng  = p.geometry ? p.geometry.location : null;
        updateCalcBtn();
      });
      // track manual typing to reset place_id if user edits after selecting
      pickupEl.addEventListener('input', () => {
        ciPickup = pickupEl.value;
        ciPickupPlaceId = null; ciPickupLatLng = null;
        updateCalcBtn();
      });
    }

    // Drop
    if (!acDropWidget) {
      acDropWidget = new google.maps.places.Autocomplete(dropEl, opts);
      acDropWidget.addListener('place_changed', () => {
        const p = acDropWidget.getPlace();
        if (!p || !p.place_id) return;
        ciDrop        = p.name + (p.formatted_address ? ', ' + p.formatted_address : '');
        ciDropPlaceId = p.place_id;
        ciDropLatLng  = p.geometry ? p.geometry.location : null;
        updateCalcBtn();
      });
      dropEl.addEventListener('input', () => {
        ciDrop = dropEl.value;
        ciDropPlaceId = null; ciDropLatLng = null;
        updateCalcBtn();
      });
    }
  }

  // Extra state for lat/lng (needed for Routes API)
  let ciPickupLatLng = null;
  let ciDropLatLng   = null;

  function updateCalcBtn() {
    const btn = document.getElementById('ci-calc-btn');
    if (btn) btn.disabled = !(ciPickupPlaceId && ciDropPlaceId);
  }

  // initAC is called after every render() when customMode is on
  function initAC() {
    if (mapsApiLoaded) {
      attachNativeAutocomplete();
    }
    // Close custom dropdowns on outside click (used in demo mode only)
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#field-pickup')) hideAC('pickup');
      if (!e.target.closest('#field-drop'))   hideAC('drop');
    });
  }

  // ── Demo-mode fallback (when no API key) ──────────────────────────────────
  function hideAC(which) {
    const el = document.getElementById('ac-' + which);
    if (el) el.style.display = 'none';
  }

  function ciPickupInput(val) {
    ciPickup = val; ciPickupPlaceId = null; ciPickupLatLng = null;
    updateCalcBtn();
    if (mapsApiLoaded) return; // native autocomplete handles it
    clearTimeout(acPickupTimer);
    acPickupTimer = setTimeout(() => showFallbackSuggestions(val, 'pickup'), 280);
  }

  function ciDropInput(val) {
    ciDrop = val; ciDropPlaceId = null; ciDropLatLng = null;
    updateCalcBtn();
    if (mapsApiLoaded) return;
    clearTimeout(acDropTimer);
    acDropTimer = setTimeout(() => showFallbackSuggestions(val, 'drop'), 280);
  }

  function showFallbackSuggestions(input, which) {
    if (!input || input.length < 2) { hideAC(which); return; }
    const DEMO = [
      {placeId:'demo1', main:'IGI Airport Terminal 3', secondary:'New Delhi'},
      {placeId:'demo2', main:'Taj Mahal', secondary:'Agra, Uttar Pradesh'},
      {placeId:'demo3', main:'Amber Fort', secondary:'Jaipur, Rajasthan'},
      {placeId:'demo4', main:'ITC Maurya', secondary:'Chanakyapuri, New Delhi'},
      {placeId:'demo5', main:'Oberoi Amarvilas', secondary:'Agra, Uttar Pradesh'},
      {placeId:'demo6', main:'Varanasi Cantt Railway Station', secondary:'Varanasi, Uttar Pradesh'},
      {placeId:'demo7', main:'Har-ki-Pauri', secondary:'Haridwar, Uttarakhand'},
      {placeId:'demo8', main:'Neemrana Fort Palace', secondary:'Alwar, Rajasthan'},
      {placeId:'demo9', main:'Ranthambore National Park', secondary:'Sawai Madhopur, Rajasthan'},
    ].filter(d =>
      d.main.toLowerCase().includes(input.toLowerCase()) ||
      d.secondary.toLowerCase().includes(input.toLowerCase())
    );
    const dropdown = document.getElementById('ac-' + which);
    if (!dropdown) return;
    if (!DEMO.length) { dropdown.style.display = 'none'; return; }
    dropdown.innerHTML = DEMO.map(item =>
      `<div class="ac-item" onmousedown="selectDemoPlace('${which}','${item.placeId}','${item.main}','${item.secondary}')">
        <div class="ac-main">${item.main}</div>
        <div class="ac-sub">${item.secondary}</div>
       </div>`
    ).join('');
    dropdown.style.display = 'block';
  }

  function selectDemoPlace(which, placeId, main, secondary) {
    const label = main + (secondary ? ', ' + secondary : '');
    if (which === 'pickup') { ciPickup = label; ciPickupPlaceId = placeId; }
    else                    { ciDrop   = label; ciDropPlaceId   = placeId; }
    hideAC(which);
    render();
  }

  // ── Distance calculation ──────────────────────────────────────────────────
  function calculateCustomRoute() {
    if (!ciPickupPlaceId || !ciDropPlaceId) return;
    ciResult = 'loading'; updateResultPanel();

    const isDemo = !mapsApiLoaded ||
                   !window.google ||
                   ciPickupPlaceId.startsWith('demo');

    if (isDemo) {
      const table = {
        demo1:{demo2:233,demo3:271,demo4:12,demo5:204,demo8:122,demo9:380},
        demo2:{demo1:233,demo3:241,demo4:204,demo5:2,demo9:340},
        demo3:{demo1:271,demo2:241,demo4:268,demo8:145,demo9:180},
        demo4:{demo1:12,demo2:204,demo3:268,demo8:120},
        demo7:{demo1:245,demo4:257},
        demo6:{demo1:820,demo4:800},
      };
      const km = (table[ciPickupPlaceId]||{})[ciDropPlaceId]
              || (table[ciDropPlaceId]||{})[ciPickupPlaceId]
              || Math.round(100 + Math.random() * 300);
      setTimeout(() => {
        ciResult = applyPricingLogic(km, ciPickup, ciDrop, ciNightHalt, tripType==='twoway');
        updateResultPanel();
      }, 800);
      return;
    }

    // Live: use Distance Matrix API with Place IDs
    const svc = new google.maps.DistanceMatrixService();
    svc.getDistanceMatrix({
      origins:      [{ placeId: ciPickupPlaceId }],
      destinations: [{ placeId: ciDropPlaceId   }],
      travelMode:   google.maps.TravelMode.DRIVING,
      unitSystem:   google.maps.UnitSystem.METRIC,
    }, (response, status) => {
      if (status !== 'OK') {
        ciResult = 'error';
        ciErrorMsg = 'Could not reach Google Maps. Please check your connection and try again.';
        updateResultPanel(); return;
      }
      const el = response.rows[0].elements[0];
      if (el.status !== 'OK') {
        ciResult = 'error';
        ciErrorMsg = 'No drivable route found between these two locations. Please verify the addresses.';
        updateResultPanel(); return;
      }
      const km = Math.round(el.distance.value / 1000);
      ciResult = applyPricingLogic(km, ciPickup, ciDrop, ciNightHalt);
      updateResultPanel();
    });
  }


  // ── Helpers ───────────────────────────────────────────────────────────────
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const DAYS   = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  function fmtDate(d) {
    if (!d) return '—';
    return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3) + ' ' + d.getFullYear();
  }
  function nightsBetween(a, b) {
    if (!a || !b) return 0;
    return Math.round((b - a) / 86400000);
  }
  function isSameDay(a, b) {
    return a && b && a.toDateString() === b.toDateString();
  }
  function dateKey(d) { return d.toDateString(); }

  // ── Calendar handlers ─────────────────────────────────────────────────────
  function calNav(dir) {
    tdCalMonth += dir;
    if (tdCalMonth > 11) { tdCalMonth = 0;  tdCalYear++; }
    if (tdCalMonth < 0)  { tdCalMonth = 11; tdCalYear--; }
    render();
  }

  function calClick(y, m, d) {
    const clicked = new Date(y, m, d);
    const today   = new Date(); today.setHours(0,0,0,0);
    if (clicked < today) return;

    if (!tdStart || (tdStart && tdEnd)) {
      // Start fresh selection
      tdStart  = clicked;
      tdEnd = null;
    } else {
      // Second click — set checkout
      if (clicked <= tdStart) {
        tdStart  = clicked;
        tdEnd = null;
      } else {
        tdEnd = clicked;
      }
    }
    render();
  }

  function toggleTag(id) {
    tdTags.has(id) ? tdTags.delete(id) : tdTags.add(id);
    render();
  }

  function confirmTravelDetails() {
    var isDayTour = activeTourId !== null && DESTINATIONS.dayTours.some(function(t){ return t.id === activeTourId; });
    if (!tdStart) return;
    if (!isDayTour && !tdEnd) return;
    if (wantHotel === null) return;
    // For day tours set tdEnd = tdStart
    if (isDayTour) { tdEnd = new Date(tdStart); }
    tdConfirmed = true;
    render();
    // Scroll past the travel details to the tour sections
    setTimeout(() => {
      const heads = document.querySelectorAll('.section-head');
      if (heads.length > 1) heads[1].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 150);

        html += `

      config.cities.forEach(city => {
        const tier     = multiCityTier[city.id];

        return `
          <div class="hotel-card ${isSelected ? 'selected' : ''}"
               onclick="${handlerName}(${JSON.stringify(h).replace(/"/g,'&quot;')})">

              <span class="hotel-rating-stars">${stars}</span>
              <span>${h.rating} / 5</span>

            <div class="hotel-price">₹${h.price.toLocaleString('en-IN')}</div>

  // ── Unified fetch function ────────────────────────────────────────────────
  // SerpAPI proxy URL — your Apps Script acts as a CORS-safe middleman
  var SERPAPI_PROXY = 'https://script.google.com/macros/s/AKfycbzsJqOKQltBR0tuZ19-ZRkFYtxP7oAPifIdFIfI__eZucf9TEelye-_9pgkJy3zYR41/exec';

  function fetchHotels(destId, tier, callback) {
    if (SERPAPI_KEY) {
      const cityName = {
        delhi:'New Delhi', agra:'Agra', jaipur:'Jaipur', varanasi:'Varanasi',
        amritsar:'Amritsar', shimla:'Shimla', manali:'Manali', haridwar:'Haridwar',
        rishikesh:'Rishikesh', mathura:'Mathura', vrindavan:'Vrindavan', corbett:'Jim Corbett'
      }[destId] || destId;
      const stars = tier.replace('star','');
      const ci = tdStart ? tdStart.toISOString().slice(0,10) : '';
      const co = tdEnd   ? tdEnd.toISOString().slice(0,10)   : '';

      // Route through Apps Script proxy to avoid CORS
      const proxyUrl = SERPAPI_PROXY
        + '?action=hotels'
        + '&city=' + encodeURIComponent(cityName)
        + '&stars=' + stars
        + '&ci=' + ci
        + '&co=' + co
        + '&key=' + SERPAPI_KEY;

      fetch(proxyUrl)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var props = (data.properties || []).slice(0, 6).map(function(p) {
            var rawPrice = p.rate_per_night
              ? parseInt((p.rate_per_night.lowest || '0').replace(/[^0-9]/g,''))
              : 0;
            // Add 10% convenience charge
            var priceWithConvenience = rawPrice ? Math.round(rawPrice * 1.10) : 0;
            return {
              name:    p.name,
              rating:  p.overall_rating || 4.0,
              price:   priceWithConvenience,
              rawPrice: rawPrice,
              link:    p.link || ''
            };
          }).filter(function(p) { return p.price > 0; });
          callback(props.length ? props : getFallback(destId, tier));
        })
        .catch(function() { callback(getFallback(destId, tier)); });
      return;
    }
    setTimeout(function() { callback(getFallback(destId, tier)); }, 500);
  }

  function getFallback(destId, tier) {
    const dest = HOTEL_FALLBACK[destId] || HOTEL_FALLBACK['delhi'];
    return (dest[tier] || dest['4star'] || []);
  }

  function toggleAncil(name) {

  // ── Pricing Summary & Currency Module ─────────────────────────────────────

  // IVORY ARC — PRICING SUMMARY & CURRENCY MODULE

  // ── Currency State ────────────────────────────────────────────
  var activeCurrency  = 'INR';   // 'INR' | 'USD' | 'EUR'
  var fxRates         = { USD: null, EUR: null };
  var fxFetchedAt     = null;    // Date object
  var fxLoading       = false;
  var fxError         = false;

  // Hotel tier midpoints (per night per room)
  var HOTEL_MIDPOINTS = { '3star': 5500, '4star': 13000, '5star': 35000 };

  // Exact pax from pax selection
  var PAX_MAP = {
    'Solo': 1, '2 People': 2, '3 People': 3, '4 People': 4,
    '5 People': 5, '6 People': 6, '7 People': 7, '8 People': 8,
    '9 People': 9, '10 People': 10
  };

  // Fallback pax if exact not selected
  var TIER_DEFAULT_PAX = { t1: 1, t2: 3, t3: 5, t4: 7 };

  // ── FX Rate Fetcher (Frankfurter API — no key needed) ─────────
  function fetchFxRates(onDone) {
    if (fxLoading) return;
    fxLoading = true;
    fxError   = false;

    // Route through Apps Script proxy — bypasses all CORS issues
    var proxyUrl = WEBHOOK_URL + '?action=fx';
    fetch(proxyUrl)
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data || !data.inr || !data.eur) throw new Error('bad data');
        fxRates.USD = parseFloat((1 / data.inr).toFixed(8));
        fxRates.EUR = parseFloat((data.eur  / data.inr).toFixed(8));
        fxFetchedAt = new Date(); fxLoading = false; fxError = false;
        renderPricingSummary();
        if (onDone) onDone(true);
      })
      .catch(function() {
        // Hard fallback — always works even if proxy fails
        fxRates.USD = 0.01183;
        fxRates.EUR = 0.01087;
        fxFetchedAt = new Date(); fxLoading = false; fxError = false;
        renderPricingSummary();
        if (onDone) onDone(true);
      });
  }

  function convertFromINR(amountINR) {
    if (activeCurrency === 'USD' && fxRates.USD) return amountINR * fxRates.USD;
    if (activeCurrency === 'EUR' && fxRates.EUR) return amountINR * fxRates.EUR;
    return amountINR;
  }

  function formatCurrency(amountINR) {
    if (activeCurrency === 'USD' && !fxRates.USD) return '₹' + amountINR.toLocaleString('en-IN');
    if (activeCurrency === 'EUR' && !fxRates.EUR) return '₹' + amountINR.toLocaleString('en-IN');
    var converted = convertFromINR(amountINR);
    if (activeCurrency === 'USD') return '$' + converted.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
    if (activeCurrency === 'EUR') return '€' + converted.toLocaleString('de-DE', {minimumFractionDigits:0, maximumFractionDigits:0});
    return '₹' + amountINR.toLocaleString('en-IN');
  }

  function fxRateLabel() {
    if (activeCurrency === 'INR') return '';
    var rate = activeCurrency === 'USD' ? fxRates.USD : fxRates.EUR;
    if (!rate) return '';
    var sym  = activeCurrency === 'USD' ? '$' : '\u20ac';
    var rateStr = (activeCurrency === 'USD')
      ? ('1 INR = ' + sym + rate.toFixed(4))
      : ('1 INR = ' + sym + rate.toFixed(4));
    var fetchTime = fxFetchedAt
      ? fxFetchedAt.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', timeZoneName:'short' })
      : '';
    return rateStr + (fetchTime ? '  \u00b7  Rate as of ' + fetchTime : '');
  }

  // ── Core Pricing Calculator ───────────────────────────────────
  function calculateTotalEstimate() {
    // Returns null if not enough info, otherwise a detailed breakdown object

    var tour = activeTourId
      ? [].concat(DESTINATIONS.dayTours, DESTINATIONS.multiDay)
          .find(function(t) { return t.id === activeTourId; })
      : null;

    if (!tour) return null;

    // ── Pax count ──
    var pax = (activePax && PAX_MAP[activePax])
      ? PAX_MAP[activePax]
      : (activeTierId ? TIER_DEFAULT_PAX[activeTierId] : null);

    if (!pax) return null;

    // ── Tour days ──
    var days = dayTourMode ? dayTourDays : (tourDays[tour.id] || 1);

    // ── Base rate per person per day ──
    var tierKey = activeTierId || 't1';
    var tierPrices = TIER_PRICES[tour.id];
    if (!tierPrices) return null;
    var baseRatePerPersonPerDay = tierPrices[tierKey];

    // ── 1. Base tour cost ──
    var baseTourCost = baseRatePerPersonPerDay * pax * days;

    var lines = [];
    lines.push({
      label:   tour.name + ' base rate',
      detail:  '\u20b9' + baseRatePerPersonPerDay.toLocaleString('en-IN') + ' \u00d7 ' + pax + (pax===1?' person':' people') + ' \u00d7 ' + days + (days===1?' day':' days'),
      amount:  baseTourCost,
      caveat:  null
    });

    // ── 2. Ancillaries ──
    var ancilTotal = 0;
    if (activeAncils && activeAncils.length) {
      var allAncils = [];
      if (tour.ancils) {
        tour.ancils.forEach(function(a) { allAncils.push(a); });
      }

      activeAncils.forEach(function(name) {
        var ancil = allAncils.find(function(a) { return a.name === name; });
        if (!ancil || ancil.price === 0) return; // included, skip

        var cost = 0;
        var detail = '';

        if (ancil.type === 'per person') {
          cost   = ancil.price * pax;
          detail = '\u20b9' + ancil.price.toLocaleString('en-IN') + ' \u00d7 ' + pax + (pax===1?' person':' people');
        } else if (ancil.type === 'per group') {
          cost   = ancil.price;
          detail = '\u20b9' + ancil.price.toLocaleString('en-IN') + ' flat (group)';
        }

        ancilTotal += cost;
        lines.push({
          label:  ancil.name,
          detail: detail,
          amount: cost,
          caveat: null
        });
      });
    }

    // ── 3. Guide adjustment ──
    // Applied to total tour cost built so far (base + ancils), not per person
    var guideCost = 0;
    var guideLine = null;
    if (guideChoice === 'english') {
      // Already included — no adjustment, note only
      guideLine = {
        label:  'English Speaking Guide',
        detail: 'Included in base rate',
        amount: 0,
        caveat: null
      };
    } else if (guideChoice === 'none') {
      guideCost = -2000;
      guideLine = {
        label:  'No Guide — deduction',
        detail: '\u20b9' + Math.abs(guideCost).toLocaleString('en-IN') + ' deducted from total tour cost',
        amount: guideCost,
        caveat: null
      };
    } else if (guideChoice === 'other') {
      guideCost = 1000;
      guideLine = {
        label:  'Other Language Guide',
        detail: '\u20b9' + guideCost.toLocaleString('en-IN') + ' added to total tour cost',
        amount: guideCost,
        caveat: 'Subject to guide availability — final confirmation provided at time of booking.'
      };
    }
    if (guideLine) lines.push(guideLine);

    // ── 4. Airport services ──
    var airportCost = 0;
    var airportItems = [
      { id: 'pickup',    label: 'Airport Pickup & Hotel Drop',  flat: 1500 },
      { id: 'porterage', label: 'Porterage',                    flat: 800  },
      { id: 'waiting',   label: 'Arrivals Waiting Service',     flat: 300  },
    ];
    airportItems.forEach(function(svc) {
      if (airportSvcs && airportSvcs.has(svc.id)) {
        airportCost += svc.flat;
        lines.push({
          label:  svc.label,
          detail: '\u20b9' + svc.flat.toLocaleString('en-IN') + ' flat — all inclusive',
          amount: svc.flat,
          caveat: null
        });
      }
    });

    // ── 5. Hotel cost ──
    var hotelCost = 0;
    var hotelLine = null;
    var nights    = nightsBetween(tdStart, tdEnd) || days;

    // Single city
    if (selectedHotel && selectedHotel.price) {
      hotelCost = selectedHotel.price * nights;
      hotelLine = {
        label:  selectedHotel.name,
        detail: '\u20b9' + selectedHotel.price.toLocaleString('en-IN') + '/night \u00d7 ' + nights + (nights===1?' night':' nights'),
        amount: hotelCost,
        caveat: 'Hotel rate based on availability at time of booking. Any increase will be communicated in advance and charged accordingly. Should rates fall, the difference will be refunded in full.'
      };
    } else if (hotelTier && HOTEL_MIDPOINTS[hotelTier]) {
      var mid = HOTEL_MIDPOINTS[hotelTier];
      var tierName = { '3star':'3-Star Comfort', '4star':'4-Star Premium', '5star':'5-Star Luxury' }[hotelTier];
      hotelCost = mid * nights;
      hotelLine = {
        label:  tierName + ' Accommodation',
        detail: '\u20b9' + mid.toLocaleString('en-IN') + ' avg/night \u00d7 ' + nights + (nights===1?' night':' nights'),
        amount: hotelCost,
        caveat: 'Estimated at mid-range for ' + tierName + ' properties. We will arrange the best available option within this tier. Any rate difference will be communicated before confirmation — overpayments refunded in full.'
      };
    }

    // Multi-city hotels
    var multiHotelCost = 0;
    var multiHotelLines = [];
    if (multiCitySelected) {
      Object.keys(multiCitySelected).forEach(function(city) {
        var h = multiCitySelected[city];
        if (h && h.price) {
          var cost = h.price * nights;
          multiHotelCost += cost;
          multiHotelLines.push({
            label:  h.name + ' (' + city.charAt(0).toUpperCase() + city.slice(1) + ')',
            detail: '\u20b9' + h.price.toLocaleString('en-IN') + '/night \u00d7 ' + nights + (nights===1?' night':' nights'),
            amount: cost,
            caveat: 'Hotel rate based on availability. Rate changes communicated in advance — overpayments refunded in full.'
          });
        }
      });
    }

    if (hotelLine) lines.push(hotelLine);
    multiHotelLines.forEach(function(l) { lines.push(l); });
    hotelCost += multiHotelCost;

    // ── 6. Subtotal before GST ──
    var subtotal = baseTourCost + ancilTotal + guideCost + airportCost + hotelCost;

    // ── 7. GST 5% ──
    var gst = Math.round(subtotal * 0.05);

    // ── 8. Grand total ──
    var grandTotal = subtotal + gst;

    // ── 9. Per person total ──
    var perPerson = Math.round(grandTotal / pax);

    return {
      lines:        lines,
      pax:          pax,
      days:         days,
      nights:       nights,
      subtotal:     subtotal,
      gst:          gst,
      grandTotal:   grandTotal,
      perPerson:    perPerson,
      tourName:     tour.name,
      hasHotel:     hotelCost > 0,
      hotelTierUsed: !selectedHotel && hotelTier,
    };
  }

  function setupRecaptcha(cb) {

    var container = document.getElementById('ivory-recaptcha-container');

    otpState.recaptchaVerifier = new window.firebase.auth.RecaptchaVerifier('ivory-recaptcha-container', {
      size: 'invisible', callback: function() {}, 'expired-callback': function() { otpState.recaptchaVerifier = null; }

  function sendOtp() {
    var nameInput  = document.getElementById('otp-name-input');
    var emailInput = document.getElementById('otp-email-input');
    var phoneInput = document.getElementById('otp-phone-input');
    if (!phoneInput) return;
    var nameVal  = nameInput  ? nameInput.value.trim()  : (otpState.name  || '');
    var emailVal = emailInput ? emailInput.value.trim() : (otpState.email || '');
    var raw      = phoneInput.value.trim();
    var digits   = raw.replace(/\D/g, '');
    if (nameVal.length < 2) { otpState.error = 'Please enter your full name.'; renderOtpSection(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(emailVal)) { otpState.error = 'Please enter a valid email address.'; renderOtpSection(); return; }
    if (!raw.startsWith('+') || digits.length < 10 || digits.length > 15) { otpState.error = 'Please enter a valid number with country code e.g. +91 98765 43210'; renderOtpSection(); return; }
    otpState.name = nameVal; otpState.email = emailVal; otpState.phone = raw;
    otpState.step = 'sending'; otpState.error = ''; renderOtpSection();
    loadFirebase(function() {
      setupRecaptcha(function() {
        window.firebase.auth().signInWithPhoneNumber(raw, otpState.recaptchaVerifier)
          .then(function(result) { otpState.confirmationResult = result; otpState.step = 'code_sent'; otpState.error = ''; startResendCooldown(); renderOtpSection(); setTimeout(function() { var i = document.getElementById('otp-code-input'); if (i) i.focus(); }, 100); })
          .catch(function(err) { otpState.step = 'idle'; otpState.error = friendlyFirebaseError(err.code); otpState.recaptchaVerifier = null; renderOtpSection(); });
      });
    });
  }

  function verifyOtp() {
    var codeInput = document.getElementById('otp-code-input');
    if (!codeInput) return;
    var code = codeInput.value.trim().replace(/\s/g, '');
    if (!code || code.length !== 6 || !/^\d+$/.test(code)) { otpState.error = 'Please enter the 6-digit code.'; renderOtpSection(); return; }
    otpState.step = 'verifying'; otpState.error = ''; renderOtpSection();
    otpState.confirmationResult.confirm(code)
      .then(function() { otpState.step = 'verified'; otpState.verifiedPhone = otpState.phone; otpState.error = ''; clearResendCooldown(); renderOtpSection(); unlockEstimate(); })
      .catch(function(err) { otpState.step = 'code_sent'; otpState.error = friendlyFirebaseError(err.code); renderOtpSection(); });
  }

  function startResendCooldown() {

  function resendOtp() {
    // Clear previous state but keep name/email/phone already collected
    otpState.step = 'sending';
    otpState.confirmationResult = null;
    otpState.recaptchaVerifier = null;
    otpState.error = '';
    clearResendCooldown();
    renderOtpSection();

    // Skip validation — we already have all details, go straight to Firebase
    var phone = otpState.phone;
    loadFirebase(function() {
      setupRecaptcha(function() {
        window.firebase.auth().signInWithPhoneNumber(phone, otpState.recaptchaVerifier)
          .then(function(result) {
            otpState.confirmationResult = result;
            otpState.step = 'code_sent';
            otpState.error = '';
            startResendCooldown();
            renderOtpSection();
            setTimeout(function() { var i = document.getElementById('otp-code-input'); if (i) i.focus(); }, 100);
          })
          .catch(function(err) {
            otpState.step = 'idle';

    return {

      tourStartDate:tdStart?tdStart.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"",
