<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ivory Arc Travels | Premium Estimator</title>
<!-- v2.1 -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<!-- Global error handler — shows real errors instead of "Script error." -->
<script>
window.addEventListener('error', function(e) {
  if (e.message === 'Script error.' || !e.message) return; // cross-origin noise
  console.error('App error:', e.message, 'at', e.filename, e.lineno);
});
window.addEventListener('unhandledrejection', function(e) {
  console.error('Unhandled promise rejection:', e.reason);
});
</script>
<!-- Firebase loads on demand when OTP is needed -->
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9V72L72QVN"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-9V72L72QVN', { send_page_view: true });

// Ivory Arc custom event tracker
function iaTrack(eventName, params) {
  if (typeof gtag === 'function') {
    gtag('event', eventName, Object.assign({ event_category: 'estimator' }, params || {}));
  }
}
</script>
<style>
  :root {
    --gold:  #C9A96E;
    --ivory: #F5F0E8;
    --black: #0D0B08;
    --dark:  #1A1612;
    --green: #34D399;
    --red:   #F87171;
  }

  /* ── Base ── */
  body { font-family: 'DM Sans', sans-serif; }
  .ivory-arc-wrap { background: var(--black); color: var(--ivory); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.6; padding: 20px; }
  .ivory-arc-wrap { display: block; }
  .ivory-arc-wrap .wrapper { max-width: 900px; margin: 0 auto; }

  /* ── Trust Strip ── */
  .trust-strip {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    border-bottom: 1.5px solid var(--gold); padding-bottom: 24px; margin-bottom: 30px;
  }
  .trust-heading { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--ivory); }
  .trust-logos { display: flex; gap: 20px; align-items: center; }
  .logo-badge {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--gold);
    border-radius: 6px; padding: 8px 14px; transition: background 0.2s;
  }
  .logo-badge:hover { background: rgba(201,169,110,0.12); }
  .logo-badge span { font-size: 12px; font-weight: 500; letter-spacing: 1.5px; color: var(--ivory); text-transform: uppercase; }
  .trust-certline { font-size: 11px; letter-spacing: 2px; color: var(--gold); }

  /* ── Section dividers ── */
  .section-head {
    font-size: 12px; color: var(--gold); margin: 40px 0 18px;
    text-transform: uppercase; letter-spacing: 2.5px;
    display: flex; align-items: center; gap: 14px;
  }
  .section-head::before, .section-head::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
  }

  /* ── Destination Grid / Cards ── */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
  .card {
    background: var(--dark); border: 0.5px solid var(--gold);
    padding: 16px; cursor: pointer; border-radius: 8px; transition: all 0.25s ease;
  }
  .card:hover { background: rgba(201,169,110,0.08); }
  .card.active { background: rgba(201,169,110,0.14); border-color: var(--gold); grid-column: 1 / -1; }
  .dest-name { font-family: 'Playfair Display', serif; font-style: italic; font-size: 20px; margin-bottom: 2px; color: #fff; }

  /* ── Days badge + stepper ── */
  .card-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .days-badge {
    font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold);
    background: rgba(201,169,110,0.12); border: 1px solid var(--gold);
    border-radius: 20px; padding: 4px 12px;
  }
  .days-stepper { display: flex; align-items: center; border: 1px solid var(--gold); border-radius: 20px; overflow: hidden; }
  .days-stepper button {
    background: rgba(201,169,110,0.1); border: none; color: var(--gold);
    width: 30px; height: 30px; font-size: 16px; cursor: pointer; line-height: 1; transition: background 0.15s;
  }
  .days-stepper button:hover { background: rgba(201,169,110,0.28); }
  .days-stepper .days-val {
    min-width: 52px; text-align: center; font-size: 12px; font-weight: 500;
    color: var(--ivory); background: rgba(0,0,0,0.3); padding: 4px 4px;
  }

  /* ── Ancillaries ── */
  .anc-deck {
    margin-top: 16px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 8px; border-top: 1px solid var(--gold); padding-top: 16px;
  }
  .anc-row {
    background: rgba(0,0,0,0.35); padding: 10px 12px;
    border: 1px solid var(--gold); border-radius: 4px;
    font-size: 13px; font-weight: 400; color: var(--ivory);
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; transition: all 0.2s;
  }
  .anc-row:hover { background: rgba(201,169,110,0.12); }
  .anc-row .anc-price { color: var(--gold); font-weight: 500; white-space: nowrap; margin-left: 8px; }
  .anc-row.active { background: var(--gold); color: var(--black); font-weight: 600; border-color: var(--gold); }
  .anc-row.active .anc-price { color: var(--black); }

  /* ── Group Size Section ── */
  .group-context-bar {
    background: rgba(201,169,110,0.08); border: 1px solid var(--gold);
    border-radius: 8px; padding: 16px 22px; margin-bottom: 18px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .gcb-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--ivory); margin-bottom: 4px; }
  .gcb-dest { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: #fff; }

  .tier-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 680px) { .tier-grid { grid-template-columns: repeat(2, 1fr); } }

  .tier-card {
    background: var(--dark); border: 1px solid var(--gold);
    border-radius: 8px; padding: 20px 14px 18px; cursor: pointer;
    transition: all 0.25s ease; text-align: center;
  }
  .tier-card:hover { background: rgba(201,169,110,0.08); }
  .tier-card.active { background: rgba(201,169,110,0.15); }
  .tier-label { font-size: 14px; font-weight: 500; color: var(--ivory); margin-bottom: 8px; }
  .tier-rate { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--gold); font-style: italic; margin-bottom: 4px; }
  .tier-rate-sub { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ivory); }

  /* Pax picker inside tier card */
  .pax-picker { margin-top: 14px; border-top: 1px solid var(--gold); padding-top: 12px; }
  .pax-picker-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ivory); margin-bottom: 10px; }
  .pax-options { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .pax-btn {
    background: transparent; border: 1px solid var(--gold);
    color: var(--ivory); font-size: 13px; font-weight: 500;
    padding: 6px 16px; border-radius: 20px; cursor: pointer; transition: all 0.15s;
  }
  .pax-btn:hover { background: rgba(201,169,110,0.15); }
  .pax-btn.active { background: var(--gold); color: var(--black); font-weight: 700; }

  /* No-selection hint */
  .group-no-dest {
    text-align: center; padding: 32px 20px;
    font-size: 13px; letter-spacing: 1.5px;
    color: var(--ivory); border: 1px dashed var(--gold); border-radius: 8px;
  }

  /* ── Guide Preferences ── */
  .guide-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px; align-items: stretch;
  }
  @media (max-width: 600px) { .guide-grid { grid-template-columns: 1fr; } }

  .guide-card {
    background: var(--dark); border: 1px solid var(--gold);
    border-radius: 8px; padding: 26px 18px 22px; cursor: pointer;
    transition: all 0.25s ease; text-align: center; position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  .guide-card:hover { background: rgba(201,169,110,0.08); }
  .guide-card.guide-none { border-color: rgba(248,113,113,0.5); }

  /* selected states */
  .guide-card.guide-english.selected { background: rgba(201,169,110,0.1); border-color: var(--gold); }
  .guide-card.guide-none.selected    { background: rgba(248,113,113,0.08); border-color: var(--red); }
  .guide-card.guide-other.selected   { background: rgba(201,169,110,0.1); border-color: var(--gold); }

  /* selection dot */
  .guide-card.selected::after {
    content: ''; position: absolute; top: 12px; right: 12px;
    width: 8px; height: 8px; border-radius: 50%;
  }
  .guide-card.guide-english.selected::after,
  .guide-card.guide-other.selected::after   { background: var(--gold); }
  .guide-card.guide-none.selected::after    { background: var(--red); }

  .guide-icon { font-size: 28px; line-height: 1; margin-bottom: 14px; }

  .guide-title {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 18px; color: #fff; line-height: 1.3; margin-bottom: 16px;
    min-height: 50px; display: flex; align-items: center; justify-content: center;
  }

  /* Clean, readable pill badges — no heavy saturated fills */
  .guide-impact {
    font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    padding: 7px 18px; border-radius: 20px; margin-bottom: 12px;
    display: inline-block;
  }
  .guide-impact.incl  {
    background: transparent; color: var(--green);
    border: 1.5px solid var(--green);
  }
  .guide-impact.minus {
    background: transparent; color: var(--red);
    border: 1.5px solid var(--red);
  }
  .guide-impact.plus  {
    background: transparent; color: var(--gold);
    border: 1.5px solid var(--gold);
  }

  .guide-availability {
    font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 14px;
  }

  .guide-caveat {
    margin-top: auto;
    font-size: 12px; line-height: 1.65; color: var(--ivory);
    padding: 12px 8px 0; border-top: 1px solid rgba(201,169,110,0.35);
    width: 100%; text-align: left;
  }

  /* ── Airport Services ── */
  .airport-intro {
    background: rgba(201,169,110,0.07); border: 1px solid var(--gold);
    border-radius: 8px; padding: 18px 22px; margin-bottom: 20px;
    display: flex; gap: 16px; align-items: flex-start;
  }
  .airport-intro-icon { font-size: 28px; flex-shrink: 0; margin-top: 2px; }
  .airport-intro-text { flex: 1; }
  .airport-intro-text strong {
    display: block; font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 17px; color: #fff; margin-bottom: 5px;
  }
  .airport-intro-text p { font-size: 13px; color: var(--ivory); line-height: 1.65; margin: 0 0 8px; }
  .airport-notice {
    font-size: 11px; color: var(--gold); letter-spacing: 0.3px;
    line-height: 1.55; border-top: 1px solid rgba(201,169,110,0.3);
    padding-top: 8px; margin-top: 2px;
  }

  .airport-services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 600px) { .airport-services-grid { grid-template-columns: 1fr; } }

  .airport-service-card {
    background: var(--dark); border: 1px solid var(--gold);
    border-radius: 8px; padding: 22px 18px 20px; cursor: pointer;
    transition: all 0.25s ease; display: flex; flex-direction: column;
    align-items: center; text-align: center; position: relative;
  }
  .airport-service-card:hover { background: rgba(201,169,110,0.08); }
  .airport-service-card.selected { background: rgba(201,169,110,0.14); }
  .airport-service-card.selected::after {
    content: '✓'; position: absolute; top: 10px; right: 13px;
    font-size: 14px; font-weight: 700; color: var(--gold);
  }

  .asc-icon { font-size: 26px; margin-bottom: 12px; }
  .asc-title {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 17px; color: #fff; line-height: 1.3; margin-bottom: 12px;
    min-height: 50px; display: flex; align-items: center; justify-content: center;
  }
  .asc-rate {
    font-size: 20px; font-family: 'Playfair Display', serif;
    font-style: italic; color: var(--gold); margin-bottom: 4px;
  }
  .asc-rate-sub { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--ivory); margin-bottom: 0; min-height: 32px; display: flex; align-items: center; justify-content: center; }

  /* Everything above the separator sits in a fixed-height block */
  .asc-body {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; min-height: 160px; padding-bottom: 14px;
  }
  .asc-desc {
    margin-top: auto; font-size: 12px; line-height: 1.65; color: var(--ivory);
    padding: 10px 6px 0; border-top: 1px solid rgba(201,169,110,0.35);
    width: 100%; text-align: left;
  }

  /* ── Locked overlay for standard sections ── */
  .section-locked { position: relative; pointer-events: none; user-select: none; }
  .section-locked::after {
    content: 'Custom Journey Mode Active';
    position: absolute; inset: 0; z-index: 10;
    background: rgba(13,11,8,0.82);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(201,169,110,0.5); border-radius: 8px;
    backdrop-filter: blur(1px);
  }

  /* ── Custom Itinerary Toggle Banner ── */
  .custom-toggle-bar {
    background: rgba(201,169,110,0.06); border: 1px solid var(--gold);
    border-radius: 10px; padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; flex-wrap: wrap;
  }
  .custom-toggle-bar.active-mode { background: rgba(201,169,110,0.12); box-shadow: 0 0 28px rgba(201,169,110,0.1); }
  .ctb-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: #fff; margin-bottom: 4px; }
  .ctb-sub { font-size: 12px; color: var(--ivory); line-height: 1.55; }

  .toggle-wrap { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .toggle-lbl { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .toggle-switch { position: relative; width: 52px; height: 28px; cursor: pointer; display: inline-block; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(201,169,110,0.4); border-radius: 28px; transition: all 0.3s;
  }
  .toggle-track::before {
    content: ''; position: absolute; width: 20px; height: 20px;
    left: 3px; top: 3px; background: rgba(201,169,110,0.45);
    border-radius: 50%; transition: all 0.3s;
  }
  .toggle-switch input:checked + .toggle-track { background: rgba(201,169,110,0.2); border-color: var(--gold); }
  .toggle-switch input:checked + .toggle-track::before { transform: translateX(24px); background: var(--gold); }

  /* ── Custom Builder Panel ── */
  .custom-builder { background: var(--dark); border: 1px solid var(--gold); border-radius: 10px; padding: 28px 24px; margin-top: 16px; }

  .ci-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 600px) { .ci-row { grid-template-columns: 1fr; } }
  .ci-field { display: flex; flex-direction: column; gap: 6px; position: relative; }
  .ci-field label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); }
  .ci-field input, .ci-field textarea {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(201,169,110,0.45);
    border-radius: 6px; padding: 11px 14px; font-size: 14px; color: var(--ivory);
    font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s;
    width: 100%; box-sizing: border-box;
  }
  .ci-field input:focus, .ci-field textarea:focus { border-color: var(--gold); background: rgba(201,169,110,0.04); }
  .ci-field input::placeholder, .ci-field textarea::placeholder { color: rgba(245,240,232,0.28); }
  /* Kill ALL browser-injected icons: validation, password managers, autofill */
  .ci-field input::-ms-reveal,
  .ci-field input::-ms-clear,
  .ci-field input::-webkit-contacts-auto-fill-button,
  .ci-field input::-webkit-credentials-auto-fill-button,
  .ci-field input::-webkit-caps-lock-indicator,
  .ci-field input::-webkit-search-cancel-button,
  .ci-field input::-webkit-search-decoration { display: none !important; }
  .ci-field input:invalid { box-shadow: none; outline: none; }
  .ci-field textarea { resize: vertical; min-height: 68px; }

  .ac-dropdown {
    position: absolute; top: calc(100% + 2px); left: 0; right: 0; z-index: 9999;
    background: #1e1a16; border: 1px solid var(--gold); border-radius: 6px;
    max-height: 210px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .ac-item { padding: 10px 14px; font-size: 13px; color: var(--ivory); cursor: pointer; border-bottom: 0.5px solid rgba(201,169,110,0.12); transition: background 0.15s; }
  .ac-item:hover { background: rgba(201,169,110,0.12); }
  .ac-item:last-child { border-bottom: none; }
  .ac-main { font-weight: 500; }
  .ac-sub { font-size: 11px; color: rgba(201,169,110,0.65); margin-top: 2px; }

  .ci-options-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ci-chip {
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(201,169,110,0.4);
    border-radius: 20px; padding: 8px 16px; cursor: pointer; transition: all 0.2s;
    font-size: 13px; color: var(--ivory); user-select: none;
  }
  .ci-chip:hover { border-color: var(--gold); }
  .ci-chip.active { background: rgba(201,169,110,0.15); border-color: var(--gold); color: #fff; }
  .ci-chip .chip-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid rgba(201,169,110,0.5); flex-shrink: 0; transition: all 0.2s; }
  .ci-chip.active .chip-dot { background: var(--gold); border-color: var(--gold); }

  .ci-calc-btn {
    width: 100%; padding: 14px; background: var(--gold); color: var(--black);
    border: none; border-radius: 8px; font-size: 14px; font-weight: 700;
    letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
    transition: all 0.2s; font-family: 'DM Sans', sans-serif; margin-top: 4px;
  }
  .ci-calc-btn:hover { background: #dbbf7e; }
  .ci-calc-btn:disabled { opacity: 0.38; cursor: not-allowed; background: var(--gold); }

  .ci-result { margin-top: 24px; border: 1px solid var(--gold); border-radius: 8px; overflow: hidden; }
  .ci-result-header { background: rgba(201,169,110,0.1); padding: 14px 20px; border-bottom: 1px solid rgba(201,169,110,0.25); }
  .ci-result-title { font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px; color: #fff; }
  .ci-result-route { font-size: 12px; color: var(--gold); margin-top: 3px; letter-spacing: 0.4px; }
  .ci-breakdown { padding: 16px 20px; }
  .ci-line { display: flex; justify-content: space-between; align-items: baseline; padding: 7px 0; border-bottom: 0.5px solid rgba(201,169,110,0.1); font-size: 13px; }
  .ci-line:last-child { border-bottom: none; }
  .ci-line-label { color: rgba(245,240,232,0.65); }
  .ci-line-val { color: var(--gold); font-weight: 500; }
  .ci-line.ci-subtotal { border-top: 1px solid rgba(201,169,110,0.2); margin-top: 6px; padding-top: 12px; }
  .ci-line.ci-subtotal .ci-line-label { color: var(--ivory); font-weight: 500; }
  .ci-line.ci-total { padding-top: 14px; border-top: 1px solid var(--gold); border-bottom: none; margin-top: 4px; }
  .ci-line.ci-total .ci-line-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: 18px; color: #fff; }
  .ci-line.ci-total .ci-line-val { font-family: 'Playfair Display', serif; font-style: italic; font-size: 28px; color: var(--gold); }
  .ci-disclaimer { padding: 12px 20px; font-size: 11px; color: var(--ivory); background: rgba(0,0,0,0.2); border-top: 1px solid rgba(201,169,110,0.15); line-height: 1.65; }
  .ci-loading { text-align: center; padding: 28px; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); }
  .ci-error { padding: 14px 18px; font-size: 13px; color: var(--red); background: rgba(248,113,113,0.06); border-radius: 6px; margin-top: 16px; border: 1px solid rgba(248,113,113,0.25); line-height: 1.55; }

  /* ── Travel Details / Calendar Gate ── */
  .td-gate-banner {
    background: rgba(201,169,110,0.07); border: 1px solid var(--gold);
    border-radius: 10px; padding: 22px 26px; margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
  }
  .td-gate-label { font-family: 'Playfair Display', serif; font-style: italic; font-size: 22px; color: #fff; margin-bottom: 4px; }
  .td-gate-sub   { font-size: 12px; color: var(--ivory); line-height: 1.55; }
  .td-gate-pill  {

  // ── Pricing Engine ────────────────────────────────────────────────────────
  function applyPricingLogic(googleKm, pickupName, dropName, nightHalt, isTwoWay) {
    var effectiveKm = isTwoWay ? googleKm * 2 : googleKm;
    // 1. Commercial buffer
    // Covers real-world deviations: hotel detours, rerouting, traffic jams,
    // wrong turns, customer stops, internal parking loops, route changes.
    let buffer;
    if (effectiveKm < 100)       buffer = 13;
    else if (effectiveKm < 300)  buffer = 33;
    else                         buffer = 55;
    const billableKm = effectiveKm + buffer;

    // 2. Distance charge @ ₹18/km on buffered distance
    // ₹18/km is an all-in rate covering fuel, driver wages, and vehicle cost.
    const distCharge = billableKm * 18;

    // 3. Toll estimate — heuristic based on NH average
    // Actual tolls billed at actuals with receipt.
    const tollPerHundred = 220;
    const toll = Math.round((billableKm * tollPerHundred / 100) / 50) * 50;

    // 4. Parking — charged at ACTUALS only, with receipt
    // Applicable at: airport, sightseeing stops, overnight halts.
    // Shown as "At Actuals" in estimate — no upfront charge collected.
    const parking = 0; // collected against receipt only

    // 5. Night halt
    const nightCost = nightHalt ? (isTwoWay ? 1600 : 800) : 0;

    // 6. Hotel cost — added when customer wants recommendation and has selected a hotel
    var hotelCost = 0;
    var hotelLine = null;
    // In custom mode: include hotel if selectedHotel exists regardless of wantHotel flag
    // (customer bypasses Travel Details in custom mode so wantHotel may stay null)
    var includeHotel = customMode ? !!selectedHotel : (wantHotel === true);
    if (includeHotel && selectedHotel && selectedHotel.price) {
      var nights = nightsBetween(tdStart, tdEnd) || 1;
      var rooms  = hotelRooms || 1;
      hotelCost = selectedHotel.price * nights * rooms;
      hotelLine = {
        name:   selectedHotel.name,
        price:  selectedHotel.price,
        nights: nights,
        rooms:  rooms,
        total:  hotelCost
      };
    } else if ((customMode ? hotelTier : wantHotel === true) && hotelTier && !selectedHotel) {
      var midpoints = { '3star': 5500, '4star': 13000, '5star': 25000 };
      var nights = nightsBetween(tdStart, tdEnd) || 1;
      var rooms  = hotelRooms || 1;
      hotelCost = (midpoints[hotelTier] || 5500) * nights * rooms;
      hotelLine = {
        name:   ({ '3star': '3-Star Comfort', '4star': '4-Star Premium', '5star': '5-Star Luxury' })[hotelTier] + ' (estimated)',
        price:  midpoints[hotelTier] || 5500,
        nights: nights,
        rooms:  rooms,
        total:  hotelCost
      };
    }

    // 7. Subtotal — transport + hotel, before GST
    const subtotal = distCharge + toll + nightCost + hotelCost;

    // 8. GST 5% on combined subtotal (transport + hotel)
    const gst = Math.round(subtotal * 0.05);

    // 9. Final total
    const total = subtotal + gst;

    return { pickup: pickupName, drop: dropName, googleKm, effectiveKm: effectiveKm, buffer, billableKm,
             distCharge, toll, nightHalt, nightCost, isTwoWay: !!isTwoWay,
             hotelCost, hotelLine, subtotal, gst, total };
  }

  // ── Google Maps — full working implementation ────────────────────────────

  // ── Native google.maps.places.Autocomplete (most reliable approach) ───────
  // We attach one Autocomplete widget per input directly rather than using
  // AutocompleteService manually — this avoids the callback/status issues.
  let acPickupWidget = null;
  let acDropWidget   = null;

  function attachNativeAutocomplete() {
    const pickupEl = document.getElementById('ci-pickup');
    const dropEl   = document.getElementById('ci-drop');
    if (!pickupEl || !dropEl) return;
    if (!window.google || !google.maps || !google.maps.places) return;

    const opts = {
      componentRestrictions: { country: 'in' },
      fields: ['place_id', 'name', 'formatted_address', 'geometry']
    };

    // Pickup
    if (!acPickupWidget) {
      acPickupWidget = new google.maps.places.Autocomplete(pickupEl, opts);
      acPickupWidget.addListener('place_changed', () => {
        const p = acPickupWidget.getPlace();
        if (!p || !p.place_id) return;
        ciPickup        = p.name + (p.formatted_address ? ', ' + p.formatted_address : '');
        ciPickupPlaceId = p.place_id;
        ciPickupLatLng  = p.geometry ? p.geometry.location : null;
        updateCalcBtn();
      });
      // track manual typing to reset place_id if user edits after selecting
      pickupEl.addEventListener('input', () => {
        ciPickup = pickupEl.value;
        ciPickupPlaceId = null; ciPickupLatLng = null;
        updateCalcBtn();
      });
    }

    // Drop
    if (!acDropWidget) {
      acDropWidget = new google.maps.places.Autocomplete(dropEl, opts);
      acDropWidget.addListener('place_changed', () => {
        const p = acDropWidget.getPlace();
        if (!p || !p.place_id) return;
        ciDrop        = p.name + (p.formatted_address ? ', ' + p.formatted_address : '');
        ciDropPlaceId = p.place_id;
        ciDropLatLng  = p.geometry ? p.geometry.location : null;
        // Update ONLY the accommodation section — do NOT call render()
        // render() rebuilds the entire DOM which collapses the custom itinerary box
        updateAccommodationSection();
        updateCalcBtn();
      });
      dropEl.addEventListener('input', () => {
        ciDrop = dropEl.value;
        ciDropPlaceId = null; ciDropLatLng = null;
        updateCalcBtn();
      });
    }
  }

  // ── Distance calculation ──────────────────────────────────────────────────
  function calculateCustomRoute() {
    if (!ciPickupPlaceId || !ciDropPlaceId) return;

    // Pre-check: reject known out-of-service destinations by name
    var dropCheckName = ciDrop.toLowerCase();
    var oosNames = ['mumbai','pune','nagpur','nashik','bangalore','bengaluru','mysore','mangalore','chennai','coimbatore','madurai','hyderabad','secunderabad','visakhapatnam','vizag','kolkata','calcutta','guwahati','bhubaneswar','raipur','indore','bhopal','goa','panaji','kochi','thiruvananthapuram','kozhikode','surat','ahmedabad','vadodara','rajkot','patna','gaya'];
    if (oosNames.some(function(k) { return dropCheckName.indexOf(k) !== -1; })) {
      var dropNameShort = ciDrop.split(',')[0];
      ciResult = null; updateResultPanel();
      if (typeof showOOSPopup === 'function') showOOSPopup(dropNameShort);
      return;
    }

    ciResult = 'loading'; updateResultPanel();

    const isDemo = !mapsApiLoaded ||
                   !window.google ||
                   ciPickupPlaceId.startsWith('demo');

    if (isDemo) {
      const table = {
        demo1:{demo2:233,demo3:271,demo4:12,demo5:204,demo8:122,demo9:380},
        demo2:{demo1:233,demo3:241,demo4:204,demo5:2,demo9:340},
        demo3:{demo1:271,demo2:241,demo4:268,demo8:145,demo9:180},
        demo4:{demo1:12,demo2:204,demo3:268,demo8:120},
        demo7:{demo1:245,demo4:257},
        demo6:{demo1:820,demo4:800},
      };
      const km = (table[ciPickupPlaceId]||{})[ciDropPlaceId]
              || (table[ciDropPlaceId]||{})[ciPickupPlaceId]
              || Math.round(100 + Math.random() * 300);
      setTimeout(() => {
        if (km > 1000) {
          var dropShort = ciDrop.split(',')[0];
          ciResult = null;
          if (typeof showOOSPopup === 'function') showOOSPopup(dropShort);
        } else {
          ciResult = applyPricingLogic(km, ciPickup, ciDrop, ciNightHalt, tripType==='twoway');
          ciLastResult = ciResult;  // persist through render cycles
        }
        updateResultPanel();
      }, 800);
      return;
    }

    // Live: use Distance Matrix API with Place IDs
    const svc = new google.maps.DistanceMatrixService();
    svc.getDistanceMatrix({
      origins:      [{ placeId: ciPickupPlaceId }],
      destinations: [{ placeId: ciDropPlaceId   }],
      travelMode:   google.maps.TravelMode.DRIVING,
      unitSystem:   google.maps.UnitSystem.METRIC,
    }, (response, status) => {
      if (status !== 'OK') {
        ciResult = 'error';
        ciErrorMsg = 'Could not reach Google Maps. Please check your connection and try again.';
        updateResultPanel(); return;
      }
      const el = response.rows[0].elements[0];
      if (el.status !== 'OK') {
        ciResult = 'error';
        ciErrorMsg = 'No drivable route found between these two locations. Please verify the addresses.';
        updateResultPanel(); return;
      }
      const km = Math.round(el.distance.value / 1000);

      // Service area check — one-way distance must be within 1000km from origin
      if (km > 1000) {
        var dropShort = ciDrop.split(',')[0];
        ciResult = null; updateResultPanel();
        if (typeof showOOSPopup === 'function') showOOSPopup(dropShort);
        return;
      }

      ciResult = applyPricingLogic(km, ciPickup, ciDrop, ciNightHalt, tripType==='twoway');
      ciLastResult = ciResult;  // persist through render cycles
      updateResultPanel();
    });
  }

    if (!d) return '—';

  function nightsBetween(a, b) {
    if (!a || !b) return 0;
    return Math.round((b - a) / 86400000);

  function isSameDay(a, b) {
    return a && b && a.toDateString() === b.toDateString();
  }
  function dateKey(d) { return d.toDateString(); }

  function calNav(dir) {

  function calClick(y, m, d) {
    const clicked = new Date(y, m, d);
    const today   = new Date(); today.setHours(0,0,0,0);
    if (clicked < today) return;

    if (!tdStart || (tdStart && tdEnd)) {
      // Start fresh selection
      tdStart  = clicked;
      tdEnd = null;
    } else {
      // Second click — set checkout
      if (clicked <= tdStart) {
        tdStart  = clicked;
        tdEnd = null;
      } else {
        tdEnd = clicked;
      }
    }
    render();
  }

  function accommodationSection() {
    const tour   = activeTour();
    const isMulti = tour && MULTI_CITY_DESTS[tour.id];

    // Custom itinerary — show hotels based on drop location (bypasses wantHotel gate)
    if (customMode) {
      if (!ciDrop) {
        return '<div class="hotel-no-dest" style="border-color:rgba(201,169,110,0.2);color:rgba(245,240,232,0.5);">Enter a drop location in the Custom Itinerary section above to see hotel options.</div>';
      }

      // Out-of-service area check
      var dropCheck = ciDrop.toLowerCase();
      var oosKeywords = ['mumbai','pune','nagpur','nashik','bangalore','bengaluru','mysore','mysuru','mangalore','chennai','coimbatore','madurai','hyderabad','secunderabad','warangal','visakhapatnam','vizag','kolkata','calcutta','howrah','siliguri','darjeeling','guwahati','bhubaneswar','cuttack','puri','raipur','indore','bhopal','goa','panaji','kochi','thiruvananthapuram','kozhikode','surat','ahmedabad','vadodara','rajkot','patna','gaya'];
      var isOOS = oosKeywords.some(function(k) { return dropCheck.indexOf(k) !== -1; });
      if (isOOS) {
        var dropName = ciDrop.split(',')[0];
        setTimeout(function() {
          if (typeof showOOSPopup === 'function') showOOSPopup(dropName);
        }, 100);
        return '<div class="hotel-no-dest" style="border-color:rgba(248,113,113,0.3);background:rgba(248,113,113,0.05);text-align:center;">' +
          '<div style="font-size:14px;color:var(--red);font-weight:600;margin-bottom:6px;">&#9888; Outside Service Area</div>' +
          '<div style="font-size:12px;color:rgba(245,240,232,0.6);">We do not serve <strong>' + dropName + '</strong>. Please see the popup for details.</div>' +
          '</div>';
      }
      var destId = getHotelDestId(ciDrop);
      var dropCityName = ciDrop.split(',')[0];
      return singleCityAccommodationForCity(destId, dropCityName);
    }

    // Non-custom mode — check wantHotel
    if (wantHotel === false) {
      return '<div class="hotel-no-dest" style="border-color:rgba(201,169,110,0.15);color:rgba(245,240,232,0.35);background:rgba(0,0,0,0.2);">&#127968; Hotel recommendation not required — you have your own arrangement. Update in Travel Details above if you change your mind.</div>';
    }

    if (!tour) {
      return '<div class="hotel-no-dest">← Select a destination above to explore accommodation options</div>';
    }

    if (dayTourMode) {
      return '<div class="hotel-no-dest" style="border-color:rgba(201,169,110,0.2);color:rgba(245,240,232,0.4);">Hotel arrangements for day tours are available on request.</div>';
    }

    if (isMulti) {
      return multiCityAccommodation(tour);
    }
    return singleCityAccommodation(tour);
  }

  // ── Multi-city accommodation ───────────────────────────────────────────────
  function multiCityAccommodation(tour) {
    const config  = MULTI_CITY_DESTS[tour.id];
    const nights  = nightsBetween(tdStart, tdEnd);
    const isSplit = config.cities.length === 2; // 2-city: guest picks preferred base

    let html = `
      <div class="hotel-context-bar">
        <div>
          <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ivory);margin-bottom:4px;">Multi-City Tour</div>

      const city = config.cities[0];
      html += `
        <div style="background:rgba(201,169,110,0.07);border:1px solid rgba(201,169,110,0.3);
             border-radius:8px;padding:14px 20px;margin-bottom:18px;font-size:13px;color:var(--ivory);line-height:1.65;">

              style="flex:1;min-width:140px;padding:16px;border-radius:8px;cursor:pointer;text-align:center;
                     border:1px solid ${(multiCityNote[tour.id]===c.id)?'var(--gold)':'rgba(201,169,110,0.4)'};

              <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:#fff;margin-bottom:4px;">${c.name}</div>

            </div>`).join('')}
        </div>`;

      const activeCity = multiCityNote[tour.id];
      if (activeCity) {
        const tier = multiCityTier[activeCity];
        const results = multiCityResults[activeCity];
        const selected = multiCitySelected[activeCity];
        html += `
          <div class="hotel-tier-grid">
            ${HOTEL_TIERS.map(t => `
              <div class="hotel-tier-card ${tier === t.id ? 'active' : ''}" onclick="selectMultiCityTier('${activeCity}','${t.id}')">

                <div class="hotel-tier-range">${t.range}</div>
              </div>`).join('')}

        if (!tier) {
          html += `<div class="hotel-no-dest" style="border-style:dashed;">Select a hotel category above</div>`;
        } else if (results === 'loading') {
          html += `<div class="hotel-loading">Searching stays in ${activeCity.charAt(0).toUpperCase()+activeCity.slice(1)}&hellip;</div>`;

          html += hotelCardsHTML(results, nights, selected, `selectMultiCityHotel_${activeCity}`);
          html += `<div class="hotel-serpapi-note">Rates inclusive of convenience charges &middot; Subject to availability at time of booking.</div>`;
        }
      }
    } else {
      // 3-city (Golden Triangle): show all 3 cities, each with its own tier + hotel selection
      config.cities.forEach(city => {
        const tier     = multiCityTier[city.id];
        const results  = multiCityResults[city.id];
        const selected = multiCitySelected[city.id];

        html += `
          <div style="margin-bottom:30px;">
            <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
              <div style="font-family:'Playfair Display',serif;font-style:italic;font-size:20px;color:#fff;">${city.name}</div>
              ${selected ? `<div style="font-size:11px;color:var(--green);letter-spacing:1px;">✓ ${selected.name}</div>` : ''}
            </div>
            <div class="hotel-tier-grid">
              ${HOTEL_TIERS.map(t => `
                <div class="hotel-tier-card ${tier === t.id ? 'active' : ''}" onclick="selectMultiCityTier('${city.id}','${t.id}')">

                  <div class="hotel-tier-range">${t.range}</div>

              : `<div class="hotel-no-dest">No data — contact us directly.</div>`
            }
          </div>`;
      });
    }
    return html;
  }

  function getHotelDestId(cityString) {
    var dl = (cityString || '').toLowerCase();
    for (var k in HOTEL_CITY_MAP) {
      if (dl.indexOf(k) !== -1) return HOTEL_CITY_MAP[k];
    }
    return 'delhi';
  }

  function selectHotelTier(tier) {
    iaTrack('hotel_tier_selected', { tier: tier, destination: activeTourId || ciDrop });
    hotelTier     = tier;
    hotelResults  = 'loading';
    selectedHotel = null;

    // In custom mode: update accommodation section in-place without full render()
    // Full render() destroys autocomplete widgets and resets ciDrop
    if (customMode) {
      updateAccommodationSection();
      var fetchDestId = getHotelDestId(ciDrop);
      var actualCity = ciDrop ? ciDrop.split(',')[0].trim() : null;
      fetchHotels(fetchDestId, tier, function(results) {
        if (results === 'no_results') {
          hotelResults = 'no_results';  // trigger inline preference-noted card
          updateAccommodationSection();
        } else {
          hotelResults = results;
          updateAccommodationSection();
          if (ciResult && ciResult !== 'loading' && ciResult !== 'error') {
            ciResult = applyPricingLogic(ciResult.googleKm, ciPickup, ciDrop, ciNightHalt, tripType==='twoway');
            renderPricingSummary();
          }
        }
      }, actualCity, ciDropLatLng);
      return;
    }

    // Regular mode: safe to full render
    render();
    var fetchDestId = activeTour() ? activeTour().id : 'delhi';
    fetchHotels(fetchDestId, tier, function(results) {
      // Regular destinations always have curated fallback — no_results should never happen
      // but if it does, use fallback silently
      hotelResults = (results === 'no_results') ? getFallback(fetchDestId, tier) : results;
      render();
    });
  }

  function updateAccommodationSection() {
    // Update only the accommodation section DOM without rebuilding the whole page

  // ── Unified fetch function ────────────────────────────────────────────────
  // SerpAPI proxy URL — your Apps Script acts as a CORS-safe middleman
  var SERPAPI_PROXY = 'https://script.google.com/macros/s/AKfycbzsJqOKQltBR0tuZ19-ZRkFYtxP7oAPifIdFIfI__eZucf9TEelye-_9pgkJy3zYR41/exec';

  // fetchHotels(destId, tier, callback, actualCityName)
  // destId     = hub id for fallback hotels (e.g. 'amritsar')
  // actualCityName = real city to search in SerpAPI (e.g. 'Chambal') — uses destId hub if omitted
  // ── fetchHotels ────────────────────────────────────────────────────────────
  // CUSTOM MODE:  search exact drop city only. If SerpAPI returns nothing → 'no_results'
  //              No hub fallback, no curated hotels shown for wrong city.
  // REGULAR MODE: search destination hub. If SerpAPI fails → curated fallback.
  // Tier fallback: 5★→4★→3★ within each stage before giving up.
  function fetchHotels(destId, tier, callback, actualCityName, dropLatLng) {
    var hubNames = {
      delhi:'New Delhi', agra:'Agra', jaipur:'Jaipur', varanasi:'Varanasi',
      amritsar:'Amritsar', shimla:'Shimla', manali:'Manali', haridwar:'Haridwar',
      rishikesh:'Rishikesh', mathura:'Mathura', vrindavan:'Vrindavan',
      corbett:'Jim Corbett', chandigarh:'Chandigarh'
    };
    var hubCoords = {
      delhi:[28.6139,77.2090], agra:[27.1767,78.0081], jaipur:[26.9124,75.7873],
      varanasi:[25.3176,82.9739], amritsar:[31.6340,74.8723], shimla:[31.1048,77.1734],
      manali:[32.2432,77.1892], haridwar:[29.9457,78.1642], rishikesh:[30.0869,78.2676],
      mathura:[27.4924,77.6737], vrindavan:[27.5794,77.6964],
      corbett:[29.5300,78.7747], chandigarh:[30.7333,76.7794]
    };
    // Tier fallback: try lower tiers before giving up
    var tierFallbacks = { '5star':['5star','4star','3star'], '4star':['4star','3star'], '3star':['3star'] };
    var tiersToTry = tierFallbacks[tier] || [tier];

    // CUSTOM MODE: search the actual drop city. Never substitute a hub.
    // REGULAR MODE: search the known hub name.
    var searchCity = actualCityName || hubNames[destId] || destId;

    // Dates are guaranteed non-null — custom mode is gated behind date confirmation
    var ci = tdStart ? tdStart.toISOString().slice(0,10) : '';
    var co = tdEnd   ? tdEnd.toISOString().slice(0,10)   : '';

    // GPS coords for 30km radius search (Stage 2)
    var lat = null, lng = null;
    if (dropLatLng && typeof dropLatLng.lat === 'function') {
      lat = dropLatLng.lat(); lng = dropLatLng.lng();
    } else if (dropLatLng && dropLatLng.lat) {
      lat = dropLatLng.lat; lng = dropLatLng.lng;
    } else if (!actualCityName && hubCoords[destId]) {
      // Regular mode: use known hub coordinates
      lat = hubCoords[destId][0]; lng = hubCoords[destId][1];
    }

    // Rating ranges for star tiers (Google Hotels 1-5 scale)
    var ratingRanges = { '3star':[3.0,4.0], '4star':[4.0,4.5], '5star':[4.5,6.0] };

    function parseProps(data) {
      var range = ratingRanges[tier] || [0, 6];
      var all = (data.properties || []).map(function(p) {
        var rawPrice = p.rate_per_night ? parseInt((p.rate_per_night.lowest||'0').replace(/[^0-9]/g,'')) : 0;
        return { name:p.name, rating:p.overall_rating||4.0, price:rawPrice ? Math.round(rawPrice*1.10) : 0, rawPrice:rawPrice, link:p.link||'' };
      }).filter(function(p) { return p.price > 0; });
      // Try to filter by rating range first; if empty, return all (city may have mixed ratings)
      var filtered = all.filter(function(p) { return p.rating >= range[0] && p.rating < range[1]; });
      return (filtered.length ? filtered : all).slice(0, 6);
    }

    // SerpAPI google_hotels: q must be JUST the city name (e.g. "Ambala")
    // NOT a sentence like "3 star hotels near Ambala India" — that returns 0 results
    // Star filtering is done client-side by overall_rating
    function buildCityUrl(t, city) {
      return SERPAPI_PROXY + '?action=hotels' +
        '&city=' + encodeURIComponent(city + ' Hotels') +
        '&stars=' + t.replace('star','') + '&ci=' + ci + '&co=' + co + '&key=' + SERPAPI_KEY;
    }

    function buildLatLngUrl(t) {
      return SERPAPI_PROXY + '?action=hotels' +
        '&city=' + encodeURIComponent('Hotels') +
        '&ll=' + encodeURIComponent('@' + lat + ',' + lng + ',12z') +
        '&stars=' + t.replace('star','') + '&ci=' + ci + '&co=' + co + '&key=' + SERPAPI_KEY;
    }

    function tagResult(hotels, actualTier) {
      hotels._requestedTier = tier;
      hotels._actualTier    = actualTier;
      return hotels;
    }

    // No API key: custom → no_results popup; regular → curated fallback
    if (!SERPAPI_KEY) {
      if (actualCityName) { callback('no_results'); return; }
      var fb = getFallback(destId, tier);
      setTimeout(function() { callback(fb.length ? tagResult(fb,tier) : 'no_results'); }, 300);
      return;
    }

    // Try each tier in the fallback chain
    function tryTier(idx) {
      if (idx >= tiersToTry.length) {
        // All tiers exhausted
        if (actualCityName) {
          // CUSTOM MODE: never show wrong-city hotels — popup only
          callback('no_results');
        } else {
          // REGULAR MODE: curated fallback
          var fallback = getFallback(destId, tier);
          callback(fallback.length ? tagResult(fallback, tier) : 'no_results');
        }
        return;
      }
      var t = tiersToTry[idx];

      // Stage 1: search by city name
      fetch(buildCityUrl(t, searchCity))
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var props = parseProps(data);
          if (props.length) { callback(tagResult(props, t)); return; }

          // Stage 2: 30km GPS radius (if coordinates available)
          if (lat && lng) {
            return fetch(buildLatLngUrl(t))
              .then(function(r2) { return r2.json(); })
              .then(function(data2) {
                var props2 = parseProps(data2);
                if (props2.length) { callback(tagResult(props2, t)); return; }
                tryTier(idx + 1);
              })
              .catch(function() { tryTier(idx + 1); });
          } else {
            tryTier(idx + 1);
          }
        })
        .catch(function() {
          if (actualCityName) {
            // Custom mode: API error → popup, not wrong-city hotels
            callback('no_results');
          } else {
            // Regular mode: API error → curated fallback
            callback(getFallback(destId, tier).length ? tagResult(getFallback(destId, tier), tier) : 'no_results');
          }
        });
    }

    tryTier(0);
  }

  function getFallback(destId, tier) {
    const dest = HOTEL_FALLBACK[destId] || HOTEL_FALLBACK['delhi'];
    return (dest[tier] || dest['4star'] || []);
  }

  // ── Pricing Summary & Currency Module ─────────────────────────────────────

  // ── Currency State ────────────────────────────────────────────
  var activeCurrency  = 'INR';   // 'INR' | 'USD' | 'EUR'
  var fxRates         = { USD: 1/85, EUR: 1/100 }; // Fixed: $1=₹85, €1=₹100
  var fxFetchedAt     = null;    // Date object
  var fxLoading       = false;
  var fxError         = false;

  // Hotel tier midpoints (per night per room)
  var HOTEL_MIDPOINTS = { '3star': 5500, '4star': 13000, '5star': 35000 };

  // Exact pax from pax selection
  var PAX_MAP = {
    'Solo': 1, '2 People': 2, '3 People': 3, '4 People': 4,
    '5 People': 5, '6 People': 6, '7 People': 7, '8 People': 8,
    '9 People': 9, '10 People': 10
  };

  // Fallback pax if exact not selected
  var TIER_DEFAULT_PAX = { t1: 1, t2: 3, t3: 5, t4: 7 };

  // ── FX Rate Fetcher (Frankfurter API — no key needed) ─────────
  function fetchFxRates(onDone) {
    // Fixed rates: $1 = ₹85, €1 = ₹100
    // Final invoice will use rates prevailing on payment date
    fxRates.USD = parseFloat((1/85).toFixed(8));
    fxRates.EUR = parseFloat((1/100).toFixed(8));
    fxFetchedAt = new Date();
    fxLoading   = false;
    fxError     = false;
    renderPricingSummary();
    if (onDone) onDone(true);
  }

  function convertFromINR(amountINR) {
    if (activeCurrency === 'USD' && fxRates.USD) return amountINR * fxRates.USD;
    if (activeCurrency === 'EUR' && fxRates.EUR) return amountINR * fxRates.EUR;
    return amountINR;
  }

  function formatCurrency(amountINR) {
    if (activeCurrency === 'USD') {
      var usd = Math.round(amountINR / 85);
      return '$' + usd.toLocaleString('en-US');
    }
    if (activeCurrency === 'EUR') {
      var eur = Math.round(amountINR / 100);
      return '€' + eur.toLocaleString('de-DE');
    }
    return '₹' + amountINR.toLocaleString('en-IN');
  }

  function fxRateLabel() {
    if (activeCurrency === 'INR') return '';
    if (activeCurrency === 'USD') return 'Rate used: $1 = ₹85 &middot; Final invoice will use rate on payment date';
    if (activeCurrency === 'EUR') return 'Rate used: €1 = ₹100 &middot; Final invoice will use rate on payment date';
    return '';
  }

  function calculateTotalEstimate() {
    // Returns null if not enough info, otherwise a detailed breakdown object

    var tour = activeTourId
      ? [].concat(DESTINATIONS.dayTours, DESTINATIONS.multiDay)
          .find(function(t) { return t.id === activeTourId; })
      : null;

    if (!tour) return null;

    // ── Pax count ──
    var pax = (activePax && PAX_MAP[activePax])
      ? PAX_MAP[activePax]
      : (activeTierId ? TIER_DEFAULT_PAX[activeTierId] : null);

    if (!pax) return null;

    // ── Tour days ──
    // If dayTourMode is on but customer has selected dates spanning multiple nights, return error
    var actualNights = nightsBetween(tdStart, tdEnd);
    if (dayTourMode && actualNights > 1) {
      return { error: 'day_tour_nights_conflict', nights: actualNights };
    }
    // For multi-night tours: use the larger of tourDays setting or actual nights selected
    // A 3-night booking = 3 days of guide/transport service
    var baseDays = dayTourMode ? dayTourDays : (tourDays[tour.id] || 1);
    var days = (!dayTourMode && actualNights > baseDays) ? actualNights : baseDays;

    // ── Base rate per person per day ──
    var tierKey = activeTierId || 't1';
    var tierPrices = TIER_PRICES[tour.id];
    if (!tierPrices) return null;
    var baseRatePerPersonPerDay = tierPrices[tierKey];

    // ── 1. Base tour cost ──
    var baseTourCost = baseRatePerPersonPerDay * pax * days;

    var lines = [];
    lines.push({
      label:   tour.name + ' base rate',
      detail:  '\u20b9' + baseRatePerPersonPerDay.toLocaleString('en-IN') + ' \u00d7 ' + pax + (pax===1?' person':' people') + ' \u00d7 ' + days + (days===1?' day':' days'),
      amount:  baseTourCost,
      caveat:  null
    });

    // ── 2. Ancillaries ──
    var ancilTotal = 0;
    if (activeAncils && activeAncils.length) {
      var allAncils = [];
      if (tour.ancils) {
        tour.ancils.forEach(function(a) { allAncils.push(a); });
      }

      activeAncils.forEach(function(name) {
        var ancil = allAncils.find(function(a) { return a.name === name; });
        if (!ancil || ancil.price === 0) return; // included, skip

        var cost = 0;
        var detail = '';

        if (ancil.type === 'per person') {
          cost   = ancil.price * pax;
          detail = '\u20b9' + ancil.price.toLocaleString('en-IN') + ' \u00d7 ' + pax + (pax===1?' person':' people');
        } else if (ancil.type === 'per group') {
          cost   = ancil.price;
          detail = '\u20b9' + ancil.price.toLocaleString('en-IN') + ' flat (group)';
        }

        ancilTotal += cost;
        lines.push({
          label:  ancil.name,
          detail: detail,
          amount: cost,
          caveat: null
        });
      });
    }

    // ── 3. Guide adjustment ──
    // Applied to total tour cost built so far (base + ancils), not per person
    var guideCost = 0;
    var guideLine = null;
    if (guideChoice === 'english') {
      // Already included — no adjustment, note only
      guideLine = {
        label:  'English Speaking Guide',
        detail: 'Included in base rate',
        amount: 0,
        caveat: null
      };
    } else if (guideChoice === 'none') {
      guideCost = -2000;
      guideLine = {
        label:  'No Guide — deduction',
        detail: '\u20b9' + Math.abs(guideCost).toLocaleString('en-IN') + ' deducted from total tour cost',
        amount: guideCost,
        caveat: null
      };
    } else if (guideChoice === 'other') {
      guideCost = 1000;
      guideLine = {
        label:  'Other Language Guide',
        detail: '\u20b9' + guideCost.toLocaleString('en-IN') + ' added to total tour cost',
        amount: guideCost,
        caveat: 'Subject to guide availability — final confirmation provided at time of booking.'
      };
    }
    if (guideLine) lines.push(guideLine);

    // ── 4. Airport services ──
    var airportCost = 0;
    var airportItems = [
      { id: 'pickup',    label: 'Airport Pickup & Hotel Drop',  flat: 1500 },
      { id: 'porterage', label: 'Porterage',                    flat: 800  },
      { id: 'waiting',   label: 'Arrivals Waiting Service',     flat: 300  },
    ];
    airportItems.forEach(function(svc) {
      if (airportSvcs && airportSvcs.has(svc.id)) {
        airportCost += svc.flat;
        lines.push({
          label:  svc.label,
          detail: '\u20b9' + svc.flat.toLocaleString('en-IN') + ' flat — all inclusive',
          amount: svc.flat,
          caveat: null
        });
      }
    });

    // ── 5. Hotel cost ──
    var hotelCost = 0;
    var hotelLine = null;
    var nights    = nightsBetween(tdStart, tdEnd) || days;

    // Single city
    if (selectedHotel && selectedHotel.price) {
      hotelCost = selectedHotel.price * nights;
      hotelLine = {
        label:  selectedHotel.name,
        detail: '\u20b9' + selectedHotel.price.toLocaleString('en-IN') + '/night \u00d7 ' + nights + (nights===1?' night':' nights'),
        amount: hotelCost,
        caveat: 'Hotel rate based on availability at time of booking. Any increase will be communicated in advance and charged accordingly. Should rates fall, the difference will be refunded in full.'
      };
    } else if (hotelTier && HOTEL_MIDPOINTS[hotelTier]) {
      var mid = HOTEL_MIDPOINTS[hotelTier];
      var tierName = { '3star':'3-Star Comfort', '4star':'4-Star Premium', '5star':'5-Star Luxury' }[hotelTier];
      hotelCost = mid * nights;
      hotelLine = {
        label:  tierName + ' Accommodation',
        detail: '\u20b9' + mid.toLocaleString('en-IN') + ' avg/night \u00d7 ' + nights + (nights===1?' night':' nights'),
        amount: hotelCost,
        caveat: 'Estimated at mid-range for ' + tierName + ' properties. We will arrange the best available option within this tier. Any rate difference will be communicated before confirmation — overpayments refunded in full.'
      };
    }

    // Multi-city hotels
    var multiHotelCost = 0;
    var multiHotelLines = [];
    if (multiCitySelected) {
      Object.keys(multiCitySelected).forEach(function(city) {
        var h = multiCitySelected[city];
        if (h && h.price) {
          var cost = h.price * nights;
          multiHotelCost += cost;
          multiHotelLines.push({
            label:  h.name + ' (' + city.charAt(0).toUpperCase() + city.slice(1) + ')',
            detail: '\u20b9' + h.price.toLocaleString('en-IN') + '/night \u00d7 ' + nights + (nights===1?' night':' nights'),
            amount: cost,
            caveat: 'Hotel rate based on availability. Rate changes communicated in advance — overpayments refunded in full.'
          });
        }
      });
    }

    if (hotelLine) lines.push(hotelLine);
    multiHotelLines.forEach(function(l) { lines.push(l); });
    hotelCost += multiHotelCost;

    // ── 6. Subtotal before GST ──
    var subtotal = baseTourCost + ancilTotal + guideCost + airportCost + hotelCost;

    // ── 7. GST 5% ──
    var gst = Math.round(subtotal * 0.05);

  /* ── Helpers ── */
  function iaFmt(d){ if(!d) return ''; return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
  function iaRef(){ return 'EST-'+Math.floor(Math.random()*9000+1000)+'-'+Math.floor(Math.random()*9000+1000); }
  function iaMoney(n,cur,rates){
    if(typeof n!=='number') return '';
    if(n<0) return '&minus;&thinsp;'+iaMoney(Math.abs(n),cur,rates);
    if(!cur||cur==='INR'||!rates||!rates[cur]) return '&#8377;'+n.toLocaleString('en-IN');
    var v=Math.round(n*rates[cur]); var sym=cur==='USD'?'$':'&euro;';
    return sym+v.toLocaleString('en-US')+'<span style="font-size:8.5px;opacity:0.55;margin-left:2px;">(&#8377;'+n.toLocaleString('en-IN')+')</span>';
  }
  function iaWA(ref,journey,dates,guests,total){
    var msg='Hello Ivory Arc Travels,\n\nI reviewed Estimate Ref: '+ref+' and would like to discuss my journey.\n\nJourney: '+journey+'\n'+(dates?'Travel Dates: '+dates+'\n':'')+(guests?'Guests: '+guests+'\n':'')+'Estimated Value: '+total+'\n\nPlease assist me with the next steps.';
    return 'https://wa.me/'+IA.phone+'?text='+encodeURIComponent(msg);
  }
  function iaQR(url){
    return '<img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&color=1A1208&bgcolor=FAF4E8&data='+encodeURIComponent(url)+'" width="110" height="110" alt="QR" style="display:block;border-radius:4px;">';
  }
  function iaRow(label,value,large){
    return '<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid '+IA.border+';">'+
      '<span style="color:'+IA.muted+';font-size:10.5px;min-width:100px;flex-shrink:0;">'+label+'</span>'+
      '<span style="font-weight:'+(large?'700':'600')+';color:'+(large?IA.goldDark:IA.text)+';font-size:'+(large?'12.5px':'10.5px')+';text-align:right;line-height:1.35;">'+value+'</span>'+
    '</div>';
  }

  /* ══════════════════════════════════════════════════════
     downloadEstimate
  ══════════════════════════════════════════════════════ */
  function downloadEstimate(){
    var calc=(typeof calculateTotalEstimate==='function')?calculateTotalEstimate():null;
    if(!calc){alert('Please complete your tour selection first.');return;}
    if(calc.error==='day_tour_nights_conflict'){
      alert('You have selected '+calc.nights+' nights but ticked "Day Tour". A day tour cannot span multiple nights.\n\nPlease either:\n• Uncheck "Day Tour" to use your selected dates\n• Or adjust your travel dates to a single day');
      return;
    }

    var ref=iaRef(); var today=new Date();
    var validUntil=new Date(today); validUntil.setDate(validUntil.getDate()+10);
    var cur=(typeof activeCurrency!=='undefined')?activeCurrency:'INR';
    var rates=(typeof fxRates!=='undefined')?fxRates:{};

    var allTours=DESTINATIONS.dayTours.concat(DESTINATIONS.multiDay);
    var destObj=activeTourId?allTours.find(function(t){return t.id===activeTourId;}):null;
    var tl={t1:'1\u20132 People',t2:'3\u20134 People',t3:'5\u20136 People',t4:'7\u201310 People'};
    var dates=(typeof tdStart!=='undefined'&&tdStart&&typeof tdEnd!=='undefined'&&tdEnd)?iaFmt(tdStart)+' \u2013 '+iaFmt(tdEnd):'';
    var guests=calc.pax?calc.pax+' Traveller'+(calc.pax!==1?'s':'')+(activeTierId&&tl[activeTierId]?' ('+tl[activeTierId]+')':''):'';
    var accom=(typeof hotelTier!=='undefined'&&hotelTier)?({'3star':'3-Star Comfort','4star':'4-Star Premium','5star':'5-Star Luxury'}[hotelTier]||''):'';
    var destName=destObj?destObj.name:'';

    var inclusions=['Private air-conditioned vehicle','Professional driver \u2014 North India specialist',
      calc.hasHotel?'Hotel accommodation as selected':null,
      'Entry fees for monuments marked Incl.','GST @ 5% on all services',
      '24\u00d77 Ivory Arc Travels concierge support','Complimentary itinerary review call'].filter(Boolean);
    var exclusions=['Airfare or train tickets',
      !calc.hasHotel?'Hotel accommodation (own arrangement)':null,
      'Personal expenses, tips &amp; gratuity','Travel insurance (recommended)',
      'Activities or meals not listed','Monument camera / video fees'].filter(Boolean);

    var leftContent=
      (destName?iaRow('Package',destName,true):'')+
      (destName?iaRow('Destination(s)',destName):'')+
      (calc.days?iaRow('Duration',calc.days+' Days / '+calc.nights+' Nights'):'')+
      (dates?iaRow('Travel Dates',dates):'')+
      (guests?iaRow('Guests',guests):'')+
      (accom?iaRow('Accommodation',accom):'');

    var body=iaBuild({
      ref:ref,today:today,validUntil:validUntil,type:'package',
      leftContent:leftContent,lines:calc.lines||[],
      subtotal:calc.subtotal,gst:calc.gst,total:calc.grandTotal,
      perPerson:calc.perPerson,pax:calc.pax,hasHotel:calc.hasHotel,
      inclusions:inclusions,exclusions:exclusions,
      journey:destName||'Private Journey',dates:dates,guests:guests,
      cur:cur,rates:rates
    });

    if(typeof iaTrack==='function') iaTrack('estimate_downloaded',{type:'package',ref:ref});
    iaOpenWin('Ivory Arc Travels \u2014 '+ref,body);
  }

  /* ══════════════════════════════════════════════════════
     downloadCustomEstimate
  ══════════════════════════════════════════════════════ */
  function downloadCustomEstimate(){
    var b=(typeof ciResult!=='undefined')?ciResult:null;
    if(!b||b==='loading'||b==='error'){alert('Please calculate your route first.');return;}

    var ref=iaRef(); var today=new Date();
    var validUntil=new Date(today); validUntil.setDate(validUntil.getDate()+10);
    var cur=(typeof activeCurrency!=='undefined')?activeCurrency:'INR';
    var rates=(typeof fxRates!=='undefined')?fxRates:{};

    var dates=(typeof tdStart!=='undefined'&&tdStart&&typeof tdEnd!=='undefined'&&tdEnd)?iaFmt(tdStart)+' \u2013 '+iaFmt(tdEnd):'';
    var journey=(b.pickup||'')+(b.isTwoWay?' \u21CC ':' \u2192 ')+(b.drop||'');

    var lines=[
      {label:'Distance Charge ('+b.billableKm+' km \u00d7 \u20b918)',amount:b.distCharge},
      {label:'Toll Charges (estimated)',amount:b.toll}
    ];
    if(b.nightHalt) lines.push({label:'Night Halt \u2014 Driver',amount:b.nightCost});
    if(b.hotelLine) lines.push({
      label:b.hotelLine.name,
      detail:'\u20b9'+b.hotelLine.price.toLocaleString('en-IN')+'/night \u00d7 '+b.hotelLine.nights+' night'+(b.hotelLine.nights!==1?'s':''),
      amount:b.hotelLine.total
    });

    var inclusions=['Private air-conditioned vehicle','Professional driver \u2014 North India specialist',
      b.hotelLine?'Hotel accommodation as selected':null,
      'GST @ 5% on all services','24\u00d77 Ivory Arc Travels concierge support',
      'Complimentary itinerary review call'].filter(Boolean);
    var exclusions=['Airfare or train tickets',
      !b.hotelLine?'Hotel accommodation (own arrangement)':null,
      'Personal expenses, tips &amp; gratuity','Travel insurance (recommended)',
      'Monument camera / video fees'].filter(Boolean);

    var leftContent=
      iaRow('Route',(b.pickup||'')+'&nbsp;'+(b.isTwoWay?'&#8644;':'&#8594;')+'&nbsp;'+(b.drop||''))+
      iaRow('Trip Type',b.isTwoWay?'Two-Way Return':'One-Way Drop')+
      iaRow('Google Maps',(b.googleKm||'')+' km'+(b.isTwoWay?' &times; 2 = '+(b.effectiveKm||'')+' km':''))+
      iaRow('Commercial Buffer','+'+(b.buffer||'')+' km')+
      iaRow('Billable Distance',(b.billableKm||'')+' km',true);

    var body=iaBuild({
      ref:ref,today:today,validUntil:validUntil,type:'custom',
      leftContent:leftContent,lines:lines,
      subtotal:b.subtotal,gst:b.gst,total:b.total,
      perPerson:null,pax:null,hasHotel:!!b.hotelLine,
      inclusions:inclusions,exclusions:exclusions,
      journey:journey,dates:dates,guests:'',
      cur:cur,rates:rates
    });

    if(typeof iaTrack==='function') iaTrack('estimate_downloaded',{type:'custom',ref:ref});
    iaOpenWin('Ivory Arc Travels \u2014 '+ref,body);
  }

  /* ── Window opener — full bleed, zero white ── */
  function iaOpenWin(title,body){
    var win=window.open('','_blank','width=1000,height=1200');
    if(!win){alert('Please allow popups to download your estimate.');return;}
    win.document.write(
      '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">'+
      '<title>'+title+'</title>'+
      '<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">'+
      '<style>'+
        '@page{size:A4 portrait;margin:0;}'+
        'html{margin:0;padding:0;background:#F2EBD9;}'+
        '*{box-sizing:border-box;margin:0;padding:0;}'+
        'body{font-family:"DM Sans",sans-serif;background:#F2EBD9;'+
          '-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}'+
        '.page{width:210mm;margin:0 auto;background:#F2EBD9;}'+
        'a{text-decoration:none;}'+
        '@media print{'+
          '@page{margin:0;size:A4 portrait;}'+
          'html,body{margin:0!important;padding:0!important;background:#F2EBD9!important;}'+
          '.page{margin:0!important;width:210mm!important;}'+
          '.no-print{display:none!important;}'+
        '}'+
      '</style></head>'+
      '<body><div class="page">'+body+'</div>'+
      '<script>window.onload=function(){setTimeout(function(){window.print();},900);};<\/script>'+
      '</body></html>'
    );
    win.document.close();
  }

  if (typeof selectHotelTier !== 'undefined') window.selectHotelTier = selectHotelTier;
  if (typeof selectHotel !== 'undefined') window.selectHotel = selectHotel;
  if (typeof setMultiCityBase !== 'undefined') window.setMultiCityBase = setMultiCityBase;

  if (typeof renderOtpSection !== 'undefined') window.renderOtpSection = renderOtpSection;

  if (typeof handleLeadSubmit !== 'undefined') window.handleLeadSubmit = handleLeadSubmit;
  if (typeof renderLeadForm !== 'undefined') window.renderLeadForm = renderLeadForm;
  if (typeof downloadEstimate !== 'undefined') window.downloadEstimate = downloadEstimate;
  if (typeof downloadCustomEstimate !== 'undefined') window.downloadCustomEstimate = downloadCustomEstimate;
  if (typeof dismissAncilPrompt !== 'undefined') window.dismissAncilPrompt = dismissAncilPrompt;
  if (typeof sendOtp !== 'undefined') window.sendOtp = sendOtp;
  if (typeof verifyOtp !== 'undefined') window.verifyOtp = verifyOtp;
  if (typeof resendOtp !== 'undefined') window.resendOtp = resendOtp;

  ['delhi','agra','jaipur','shimla','manali','haridwar',
   'rishikesh','mathura','vrindavan','corbett','varanasi','amritsar'].forEach(function(cityId) {
    window['selectMultiCityHotel_' + cityId] = function(h) {
      multiCitySelected[cityId] = (multiCitySelected[cityId] && multiCitySelected[cityId].name === h.name) ? null : h;
      render();
    };
  });

  // Use setTimeout(0) to ensure the DOM is ready in all environments including WordPress
  setTimeout(function() { render(); }, 0);

</script>
