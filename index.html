<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan with IVY — Ivory Arc Travels</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --green:#075E54;--green2:#128C7E;--bright:#25D366;
  --bg:#F5F0E8;--bub-user:#EDE5D8;--card:#fff;
  --line:#E0D6CA;--muted:#9A9490;--ink:#2A2420;
  --gold:#C9A84C;--gold-lt:#FBF6EA;--ivory:#FDF9F4;--ia-bg:#EDE8E0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1A1410;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.45;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(0,0,0,.55)}
/* ── HEADER (Phase 1: ivory avatar bg) ── */
header{background:var(--green);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;flex-shrink:0}
.av{position:relative;width:44px;height:44px;flex-shrink:0}
.av img{width:44px;height:44px;border-radius:50%;background:var(--ivory);border:2px solid var(--gold);object-fit:contain;display:block;padding:3px}
.badge{position:absolute;bottom:-2px;right:-2px;width:17px;height:17px}
.hi{flex:1}.ht{font-weight:600;font-size:15px;display:flex;align-items:center;gap:5px}
.hs{font-size:10.5px;color:#bfe9d6;letter-spacing:.3px}.hon{font-size:10px;color:#7DEBA5;margin-top:1px}
.hsel{display:flex;gap:6px;flex-shrink:0}
header select{background:var(--green2);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 7px;font-size:12px;cursor:pointer}
/* ── CHAT ── */
.chat-bg{flex:1;overflow-y:auto;padding:14px 12px 10px;scroll-behavior:smooth}
.msg{display:flex;align-items:flex-end;gap:8px;margin:5px 0}
.msg.bot{flex-direction:row}.msg.user{flex-direction:row-reverse}
/* Phase 1: avatar on ivory bg, gold ring */
.mav{width:28px;height:28px;border-radius:50%;background:var(--ivory);border:1.5px solid var(--gold);overflow:hidden;flex-shrink:0}
.mav img{width:100%;height:100%;object-fit:contain;padding:2px}
.bubble{max-width:80%;padding:9px 12px 7px;border-radius:10px;font-size:14px;position:relative;line-height:1.5}
.bot-bubble{background:#fff;border-top-left-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.user-bubble{background:var(--bub-user);border-top-right-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* Phase 1: timestamps only, NO ticks */
.ts{display:block;font-size:9.5px;color:var(--muted);text-align:right;margin-top:3px}
/* typing */
.td{display:flex;gap:5px;padding:5px 4px}
.dot{width:6px;height:6px;border-radius:50%;background:#BFB8B0;animation:td 1.4s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-6px);opacity:1}}
.date-badge{text-align:center;margin:8px 0}
.date-badge span{background:rgba(201,168,76,.15);border-radius:20px;font-size:10.5px;color:#8B7340;padding:4px 14px}
/* ── INPUT AREA ── */
.input-area{background:var(--ia-bg);padding:8px 10px;flex-shrink:0;border-top:1px solid var(--line)}
.ia-simple{display:flex;gap:8px;align-items:center}
.ia-simple input{flex:1;border:0;border-radius:22px;padding:10px 16px;font-size:14px;outline:none;background:#fff;color:var(--ink)}
.ia-send{width:40px;height:40px;border-radius:50%;background:var(--green);border:0;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ia-card{background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.ia-card .cat{font-size:10px;font-weight:700;letter-spacing:1.3px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;display:block}
.qr-btns{display:flex;flex-wrap:wrap;gap:8px}
.qr-btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .15s}
.qr-btn:hover{border-color:var(--gold)}.qr-btn.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.ia-continue{width:100%;background:var(--bright);color:#064A20;border:0;border-radius:8px;padding:12px;font-weight:600;font-size:14.5px;cursor:pointer;margin-top:10px;font-family:inherit}
.ia-skip{width:100%;background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px;font-size:13px;cursor:pointer;margin-top:6px;font-family:inherit}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.stepper button{border:0;background:var(--gold-lt);color:#8B6B2A;width:36px;height:36px;font-size:20px;cursor:pointer;flex-shrink:0;font-weight:300}
.stepper span{min-width:42px;text-align:center;font-weight:600;font-size:17px}
/* start location card */
.start-opt{border:1px solid var(--line);border-left:3px solid transparent;border-radius:8px;padding:12px 14px;cursor:pointer;background:#fff;margin-top:7px;transition:all .15s}
.start-opt:hover{border-left-color:var(--gold)}.start-opt.on{background:var(--gold-lt);border-color:var(--gold);border-left-color:var(--gold)}
.start-opt .so-title{font-weight:600;font-size:14px}.start-opt .so-sub{font-size:12px;color:var(--muted);margin-top:2px}
/* interest chips */
.int-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.int-card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;background:#fff;text-align:center;transition:all .15s}
.int-card:hover{border-color:var(--gold)}.int-card.on{background:var(--gold-lt);border-color:var(--gold)}
.int-card .ic-icon{font-size:20px;margin-bottom:4px}.int-card .ic-lbl{font-weight:600;font-size:14px;color:var(--ink)}
.int-card .ic-sub{font-size:11px;color:var(--muted);margin-top:2px}
/* recommendation gate */
.rec-gate{display:flex;flex-direction:column;gap:8px}
.rec-btn{border:1px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer;background:#fff;text-align:left;font-family:inherit;font-size:14px;color:var(--ink);transition:all .15s}
.rec-btn:hover{border-color:var(--gold);background:var(--gold-lt)}
.rec-btn b{display:block;font-size:14.5px;color:var(--ink)}.rec-btn span{font-size:12px;color:var(--muted)}
/* route cards */
.route-cards{display:flex;flex-direction:column;gap:7px;max-height:290px;overflow-y:auto}
.route-card{border:1px solid var(--line);border-left:3px solid transparent;border-radius:8px;padding:11px 13px;cursor:pointer;background:#fff;transition:all .15s}
.route-card:hover{border-left-color:var(--gold)}.route-card.on{background:var(--gold-lt);border-color:var(--gold);border-left-color:var(--gold)}
.route-card .rc-cat{font-size:9px;font-weight:700;letter-spacing:1.3px;color:var(--gold);text-transform:uppercase;margin-bottom:3px}
.route-card .rc-nm{font-weight:600;font-size:14px}.route-card .rc-desc{font-size:11.5px;color:var(--muted);margin-top:2px}
.route-card .rc-nights{font-size:11px;color:var(--gold);margin-top:4px;font-weight:600}
/* dest cards */
.dest-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:230px;overflow-y:auto}
.dest-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:#fff;transition:border-color .15s}
.dest-card:hover{border-color:var(--gold)}.dest-card.on{background:var(--gold-lt);border-color:var(--gold)}
.dest-card .dc-nm{font-weight:600;font-size:13.5px}.dest-card .dc-rt{font-size:11px;color:var(--muted);margin-top:2px}
.dest-card .dc-ord{font-size:10px;color:var(--gold);font-weight:700;margin-top:3px}
/* feasibility warning */
.feas-warn{background:#FEF9EC;border:1px solid var(--gold);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:13px}
.feas-warn b{color:#8B6B2A}
/* nights alloc */
.alloc-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.alloc-row:last-child{border:0}
/* hotel rows */
.hotel-row{border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-top:7px;background:var(--ivory);cursor:pointer;transition:all .15s}
.hotel-row:hover{border-color:var(--gold)}.hotel-row.on{background:var(--gold-lt);border-color:var(--gold)}
/* vehicle */
.veh-btn{border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;background:#fff;display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;transition:all .15s}
.veh-btn:hover{border-color:var(--gold)}.veh-btn.on{background:var(--gold-lt);border-color:var(--gold)}
.veh-tag{font-size:10px;letter-spacing:.8px;font-weight:700;color:var(--gold);text-transform:uppercase}
/* addons */
.addon-row{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:7px;background:#fff;cursor:pointer;transition:all .15s}
.addon-row:hover{border-color:var(--gold)}.addon-row.on{background:var(--gold-lt);border-color:var(--gold)}
.addon-row .ar-lbl{font-weight:600;font-size:13.5px}.addon-row .ar-price{font-size:12px;color:var(--muted);margin-top:2px}
.pax-sel{display:flex;align-items:center;gap:8px;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.pax-sel span{font-size:12px;color:var(--muted)}
/* ─── PROPOSAL CARD (Phase 13) ─── */
.est-card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.09);color:var(--ink);margin:4px 0}
.est-ch{background:var(--gold-lt);padding:14px 16px 12px;border-bottom:1px solid #EDE5D8}
.est-ref{font-size:9.5px;letter-spacing:1.5px;color:var(--gold);font-weight:700;text-transform:uppercase}
.est-ch-title{font-size:12.5px;font-weight:700;letter-spacing:1.2px;color:var(--ink);text-transform:uppercase;margin-top:2px}
.est-sec{padding:11px 16px;border-bottom:1px solid #F0EAE0}
.est-sec:last-child{border:0}
.est-sl{font-size:9.5px;letter-spacing:1.5px;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.est-pair{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.est-pl{color:var(--muted)}.est-pv{font-weight:500;text-align:right;max-width:57%}
.est-route-disp{font-size:13.5px;font-weight:600;line-height:1.6}
.est-item{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px;border-bottom:1px dashed #EDE5D8}
.est-item:last-child{border:0}
.est-item-l{color:var(--muted);flex:1}.est-item-r{font-weight:500;white-space:nowrap;margin-left:8px}
.est-gst{display:flex;justify-content:space-between;padding:5px 0 2px;font-size:12.5px;color:var(--muted)}
.est-total-row{display:flex;justify-content:space-between;padding:11px 16px;background:var(--ink);color:#fff;font-size:15px;font-weight:700;letter-spacing:.3px}
.est-ppd-row{padding:8px 16px;background:var(--gold-lt);text-align:center;font-size:12px;color:#8B6B2A;border-bottom:1px solid #EDE5D8}
.est-sched-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px}
.est-sched-label{color:var(--muted)}.est-sched-adv{font-weight:700;color:var(--gold)}
.est-incl-item{font-size:12px;color:var(--muted);padding:3px 0;display:flex;gap:6px}
.est-incl-item::before{content:"—";color:var(--gold);flex-shrink:0}
.est-note{padding:10px 16px;background:#F8F4EE;border-top:1px solid #EDE5D8;font-size:11.5px;color:var(--muted);line-height:1.6}
.est-disc{display:inline-block;background:var(--gold-lt);border:1px solid var(--gold);border-radius:4px;padding:2px 8px;font-size:10.5px;color:#8B6B2A;font-weight:600;margin-top:5px}
/* itinerary CTA (Phase 15) */
.cta-card{background:var(--gold-lt);border:1px solid var(--gold);border-radius:10px;padding:14px 16px;margin-top:8px;text-align:center}
.cta-card p{font-size:13.5px;color:var(--ink);margin-bottom:12px}
.cta-card button{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:11px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px}
/* hotel diagnostic */
.diag-box{background:#FFF8F0;border:1px solid #F0C070;border-radius:8px;padding:10px 12px;font-size:12px;color:#8B5E00;margin-top:8px;line-height:1.6}
/* city-by-city hotels */
.city-hotel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:9px;background:var(--ivory)}
.chc-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:2px}
.chc-head span{font-size:11px;color:var(--muted)}
.hotel-notice{background:#FEF9EC;border:1px solid #EAD9A8;border-radius:8px;padding:9px 11px;font-size:11.5px;color:#8B6B2A;margin-top:10px;line-height:1.55}
.comfort-stars{color:var(--gold);letter-spacing:3px;font-size:16px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(26,20,16,.75);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
.modal .box{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;border-top:3px solid var(--gold)}
.modal h3{color:var(--ink);font-size:16px;margin:0 0 8px}
.modal input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px;margin-top:6px;outline:none;color:var(--ink)}
.modal input:focus{border-color:var(--gold)}
.modal .btn{background:var(--bright);color:#064A20;border:0;border-radius:8px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;width:100%;margin-top:10px;font-family:inherit}
.modal .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px;font-size:13px;cursor:pointer;width:100%;margin-top:8px;font-family:inherit}
.modal .err{color:#B33333;font-size:12.5px;margin-top:6px}
.hide{display:none}.muted{color:var(--muted);font-size:13px}
.ia-input-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.ia-input-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;color:var(--ink)}
</style>
</head>

function km(a,b){const R=6371,d2r=Math.PI/180;const dLat=(b[0]-a[0])*d2r,dLon=(b[1]-a[1])*d2r;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*d2r)*Math.cos(b[0]*d2r)*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(x))*1.3);}

/* City-by-city night & date plan (Blocker 4). Reuses S.nights exactly as compute() reads it. */
function cityNightPlan(){
  const plan=[];if(!S.dest.length)return plan;
  let cursor=S.startDate?new Date(S.startDate):null;
  const last=S.dest.length-1;
  S.dest.forEach((k,i)=>{
    const days=S.nights[k]||1;
    // first dest has +1 internal transit day; show customer the actual nights they allocated
    const nts=i===0?Math.max(days-1,0):days;
    const arr=cursor?new Date(cursor):null;
    const dep=arr?new Date(arr.getTime()+nts*86400000):null;
    if(nts>0)plan.push({k,name:DEST[k]?DEST[k].name:k,nights:nts,arr,dep});
    if(cursor&&dep)cursor=dep;});
  return plan;}

/* Journey Comfort Score (Blocker 7) — distance + minimum-nights driven */
function comfortScore(){
  const pts=['Delhi'].concat(S.dest.map(k=>DEST_CITY[k]).filter(Boolean));
  let kmSum=0;for(let i=0;i<pts.length-1;i++){const a=CITY[pts[i]],b=CITY[pts[i+1]];if(a&&b)kmSum+=km(a,b);}
  const perNight=S.customNights?kmSum/S.customNights:kmSum;
  let minOk=true;S.dest.forEach(k=>{const m=DEST_META[k];if(m&&S.customNights<m.min)minOk=false;});
  const densityOk=S.dest.length<=1||S.customNights>=S.dest.length-1;
  if(perNight<=180&&minOk&&densityOk)return{stars:5,label:'Comfortable',msg:'A beautifully paced journey with time to settle into each place.'};
  if(perNight<=300&&densityOk)return{stars:4,label:'Balanced',msg:'A well-balanced pace with comfortable driving days.'};
  if(perNight<=450&&densityOk)return{stars:3,label:'Brisk',msg:'An active pace — entirely achievable, with fuller days on the road.'};
  return{stars:2,label:'Rushed',msg:'This plan involves long driving days. I would suggest adding a night or simplifying the route.'};}

/* ======================== PRICING ENGINE (UNCHANGED) === */
function bandRed(ad){return ad<=2?0:ad<=4?1000:ad<=6?2500:3500;}
function rooms(ad){return Math.max(Math.ceil(ad/2),1);}
function fmt(inr){const f=FX[S.cur];return f.s+Math.round(inr/f.r).toLocaleString();}
function findExp(id){for(const k in EXPER){const f=EXPER[k].find(e=>e.id===id);if(f)return f;}return null;}
// Phase 11: S.addons[id] is now a participant count (number). Pricing formula unchanged.
function addonCost(){let tot=0;Object.keys(S.addons).forEach(id=>{
  const pax=S.addons[id];if(!pax)return;
  const e=findExp(id);if(!e)return;
  let c=e.t==='pp'?e.price*pax:e.price;if(e.coord)c+=200*pax;tot+=c;});return tot;}
function hotelCost(nts){if(S.hotel==='none'||!nts)return[0,0];
  const plan=(typeof cityNightPlan==='function')?cityNightPlan():[];
  let room=0;
  if(plan.length){
    plan.forEach(c=>{const ch=(S.cityHotels||{})[c.k]||{};
      const n=ch.nightly>0?ch.nightly:(S.hotelNightly>0?S.hotelNightly:HOTELS[S.hotel].n);
      room+=n*rooms(S.adults)*c.nights;});
  }else{const n=S.hotelNightly>0?S.hotelNightly:HOTELS[S.hotel].n;room=n*rooms(S.adults)*nts;}
  return[room,Math.round(room*0.10)];}
function compute(){
  const ad=S.adults,ch=S.children,guests=ad+ch;
  if(ad>10)return{escalate:true};
  let items=[],days=0,nts=0;
  if(S.mode==='curated'){
    let runMax=0,rack=0;
    S.dest.forEach(k=>{const d=DEST[k];const dys=S.nights[k]||1;days+=dys;
      runMax=Math.max(runMax,d.base);const rate=runMax-bandRed(ad);
      rack+=(ad*rate+ch*0.25*rate)*dys;});
    nts=Math.max(days-1,0);
    items.push(['Journey services (private transportation + sightseeing)',Math.round(rack)]);
  } else {
    nts=S.customNights;days=nts+1;
    let sum=0;for(let i=0;i<S.route.length-1;i++){const a=CITY[S.route[i]],b=CITY[S.route[i+1]];if(a&&b)sum+=km(a,b);}
    const floor=300*(nts+1);const billable=Math.round(Math.max(sum,floor)*1.055);
    const trans=billable*VEH[S.veh].r;
    items.push(['Transportation: '+billable+' km at ₹'+VEH[S.veh].r+'/km ('+VEH[S.veh].l+')',trans]);
    if(nts>0)items.push(['Driver overnight: '+nts+' night'+(nts>1?'s':''),1000*nts]);
  }
  if(S.mode==='curated'){const gr={english:2000,other:3500}[S.guide]||0;if(gr)items.push(['Private guide ('+days+' days)',gr*days]);}
  const add=addonCost();if(add)items.push(['Selected experiences & add-ons',add]);
  const[room,coord]=hotelCost(nts);
  if(room){items.push(['Accommodation ('+rooms(ad)+' room'+(rooms(ad)>1?'s':'')+' · '+nts+' night'+(nts>1?'s':'')+')',room]);
           items.push(['Accommodation coordination (10%)',coord]);}
  const sub=items.reduce((a,b)=>a+b[1],0);const gst=Math.round(sub*0.05);const total=sub+gst;
  const ppd=guests&&days?total/(guests*days):0;const disc=bandRed(ad);
  return{items,sub,gst,total,ppd,days,guests,nts,disc};}

function nowTS(){return new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
function scrollBot(){const b=$('chatBg');b.scrollTop=b.scrollHeight;}
function addBot(html){
  const d=document.createElement('div');d.className='msg bot';
  d.innerHTML=`<div class="mav"><img src="${LOGO}"></div>
    <div class="bubble bot-bubble">${html}<span class="ts">${nowTS()}</span></div>`;
  MSGS().appendChild(d);scrollBot();}
// Phase 1: NO ticks, timestamps only
function addUser(text){
  const d=document.createElement('div');d.className='msg user';
  d.innerHTML=`<div class="bubble user-bubble">${text}<span class="ts">${nowTS()}</span></div>`;
  MSGS().appendChild(d);scrollBot();}
let _typ=null;
function showTyping(){_typ=document.createElement('div');_typ.className='msg bot';
  _typ.innerHTML=`<div class="mav"><img src="${LOGO}"></div>
    <div class="bubble bot-bubble"><div class="td"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
  MSGS().appendChild(_typ);scrollBot();}
function hideTyping(){if(_typ){_typ.remove();_typ=null;}}
function botSay(html,delay,done){
  const d=Math.min(delay||(900+html.replace(/<[^>]+>/g,'').length*11),2800);
  showTyping();setTimeout(()=>{hideTyping();addBot(html);if(done)done();},d);}

/* ======================== PHASE 2: NAME CLEANING ======= */
function cleanName(v){
  const greet=['hi ','hello ','hey ','namaste ','dear ','good morning ','good afternoon ','good evening ','greetings '];
  let s=v.trim();
  for(const g of greet)if(s.toLowerCase().startsWith(g))s=s.substring(g.length).trim();
  return s.trim();}

function autoVeh(){const g=S.adults+S.children;S.veh=g<=2?'sedan':g<=4?'suv':'tempo';}
// Phase 10: hotel-influenced vehicle recommendation
function recVehicle(){
  const g=S.adults+S.children;
  let base=g<=2?'sedan':g<=4?'suv':'tempo';
  if(S.interest==='Mountains'&&g<=4)base='suv';      // hill roads: SUV is the sensible floor
  if(S.hotel==='luxury'&&g<=4)return'luxury';        // luxury stay -> premium fleet first
  if(S.hotel==='premium'&&g<=4)return'luxury';
  return base;}

function nextStep(){
  while(FLOW_IDX<FLOW.length){
    const step=FLOW[FLOW_IDX++];
    if(step.cond&&!step.cond())continue;
    if(step.type==='bot'){const raw=typeof step.text==='function'?step.text():step.text;
      if(!raw){nextStep();return;}botSay(raw,step.delay,nextStep);return;}
    if(step.type==='estimate'){showEstimate();return;}
    const raw=typeof step.botText==='function'?step.botText():step.botText;
    botSay(raw,null,()=>renderInput(step));return;}}

/* ======================== INPUT RENDERERS =============== */
function renderInput(step){
  const ia=IA();ia.innerHTML='';
  switch(step.inputType){
    case 'text':case 'email':{
      ia.innerHTML=`<div class="ia-simple"><input type="${step.inputType}" id="chatIn" placeholder="${step.placeholder||''}" autocomplete="off"><button class="ia-send" id="iaSend">&#8594;</button></div>`;
      const inp=$('chatIn');inp.focus();
      const go=()=>{const v=inp.value.trim();if(!v||(step.validate&&!step.validate(v)))return;submitStep(step,v,step.display?step.display(v):v);};
      $('iaSend').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go();};break;}
    case 'phone':{
      ia.innerHTML=`<div class="ia-simple"><input type="tel" id="chatIn" placeholder="${step.placeholder||'+91 XXXXX XXXXX'}" autocomplete="tel"><button class="ia-send" id="iaSend">&#8594;</button></div>`;
      const inp=$('chatIn');inp.focus();
      const go=()=>{const v=inp.value.trim();if(!v||(step.validate&&!step.validate(v))){inp.style.borderColor='#B33333';return;}submitStep(step,v,step.display?step.display(v):v);};
      $('iaSend').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go();};break;}
    case 'date':{
      ia.innerHTML=`<div class="ia-card"><span class="cat">Journey start date</span>
        <input type="date" id="chatDate" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;color:var(--ink);display:block;margin-bottom:220px">
        <button class="ia-continue" id="iaDateOk" style="margin-top:0">Confirm date</button></div>`;
      const mn=new Date().toISOString().split('T')[0];$('chatDate').min=mn;$('chatDate').value=S.startDate||mn;
      $('iaDateOk').onclick=()=>{const v=$('chatDate').value;if(!v)return;submitStep(step,v,step.display(v));};break;}
    case 'stepper':{
      let val=S[{nights:'customNights',adults:'adults',children:'children'}[step.id]]||step.initial||1;
      const render=()=>{const stepLbl=step.id==='nights'?(val===0?'Day tour (same-day return)':val+(val===1?' night':' nights')):'';
        ia.innerHTML=`<div class="ia-card">
        <div style="display:flex;align-items:center;justify-content:center;gap:16px;padding:4px 0;flex-wrap:wrap">
          <div>
            <div class="stepper"><button id="sM">&#8722;</button><span id="sV">${val}</span><button id="sP">&#43;</button></div>
            ${stepLbl?`<div style="text-align:center;font-size:12px;color:var(--gold);margin-top:4px">${stepLbl}</div>`:''}
          </div>
          <button class="ia-continue" style="width:auto;padding:11px 28px;margin:0" id="iaSOk">Confirm</button>
        </div></div>`;
        $('sM').onclick=()=>{val=Math.max(step.min||0,val-1);render();};
        $('sP').onclick=()=>{val=Math.min(step.max||99,val+1);render();};
        $('iaSOk').onclick=()=>submitStep(step,val,step.display(val));};render();break;}
    case 'choices':{
      ia.innerHTML=`<div class="ia-card"><div class="qr-btns">`+
        step.choices.map(c=>`<button class="qr-btn" data-cv="${c.v}">${c.label}</button>`).join('')+`</div></div>`;
      ia.querySelectorAll('.qr-btn').forEach(b=>b.onclick=()=>submitStep(step,b.dataset.cv,step.display(b.dataset.cv)));break;}
    // Blocker 2: start location with Google Places Autocomplete (lodging, India)
    case 'start_location':{
      const opts=[
        {id:'delhi_airport',label:'Delhi Airport (IGI)',sub:'Terminal 2 or 3 \u00b7 Our chauffeur meets you at arrivals'},
        {id:'noida_airport',label:'Noida International Airport',sub:'Jewar \u00b7 Delhi NCR\'s new gateway'},
        {id:'hotel_delhi',label:'Hotel in Delhi NCR',sub:'We collect you from your property'},
      ];
      let sel=null,hotelName='',hotelAddress='',hotelPlaceId='';
      const render=()=>{
        ia.innerHTML=`<div class="ia-card"><span class="cat">Your starting point</span>`+
          opts.map(o=>`<div class="start-opt ${sel&&sel.id===o.id?'on':''}" data-oid="${o.id}"><div class="so-title">${o.label}</div><div class="so-sub">${o.sub}</div></div>`).join('')+
          (sel&&sel.id==='hotel_delhi'?`<div style="margin-top:10px">
            <input type="text" id="hotelInp" placeholder="Start typing your hotel name\u2026" autocomplete="off" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink)">
            <div id="hotelAddr" class="muted" style="font-size:11.5px;margin-top:4px"></div></div>`:'')+
          `<button class="ia-continue" id="iaLocOk" ${sel?'':'disabled'}>${sel&&sel.id==='hotel_delhi'?'Confirm hotel':'Confirm location'}</button></div>`;
        ia.querySelectorAll('.start-opt').forEach(c=>c.onclick=()=>{sel=opts.find(o=>o.id===c.dataset.oid);render();});
        $('iaLocOk').onclick=()=>{
          if(!sel)return;
          if(sel.id==='hotel_delhi'){const hi=$('hotelInp');if(hi){if(!hotelName)hotelName=hi.value.trim();if(!hotelName){hi.style.borderColor='#B33333';return;}}}
          submitStep(step,{id:sel.id,label:sel.label+(hotelName?' \u2014 '+hotelName:''),hotelName,hotelAddress,placeId:hotelPlaceId},sel.label+(hotelName?' \u2014 '+hotelName:''));};
        if(sel&&sel.id==='hotel_delhi'){setTimeout(()=>{const hi=$('hotelInp');if(!hi)return;hi.focus();
          hi.addEventListener('input',()=>{hotelName=hi.value.trim();hotelPlaceId='';});
          loadPlaces(ok=>{if(!ok||!window.google)return;
            const ac=new google.maps.places.Autocomplete(hi,{types:['lodging'],componentRestrictions:{country:'in'},fields:['name','formatted_address','place_id']});
            ac.addListener('place_changed',()=>{const p=ac.getPlace();
              hotelName=p.name||hi.value.trim();hotelAddress=p.formatted_address||'';hotelPlaceId=p.place_id||'';
              if(p.name)hi.value=p.name;const ha=$('hotelAddr');if(ha)ha.textContent=hotelAddress;});});},60);}};
      render();break;}
    // Phase 4: interest type
    case 'interest_type':{
      const interests=[
        {v:'Heritage',icon:'&#127963;',sub:'Forts, palaces, Mughal history'},
        {v:'Pilgrimage',icon:'&#127481;',sub:'Spiritual sites, sacred rivers'},
        {v:'Mountains',icon:'&#9968;',sub:'Himalayan escapes, hill stations'},
        {v:'Wildlife',icon:'&#129430;',sub:'Tiger reserves, national parks'},
      ];
      ia.innerHTML=`<div class="ia-card"><span class="cat">Journey type</span><div class="int-grid">`+
        interests.map(i=>`<div class="int-card" data-iv="${i.v}">
          <div class="ic-icon">${i.icon}</div>
          <div class="ic-lbl">${i.v}</div>
          <div class="ic-sub">${i.sub}</div>
        </div>`).join('')+`</div></div>`;
      ia.querySelectorAll('[data-iv]').forEach(c=>c.onclick=()=>submitStep(step,c.dataset.iv,c.dataset.iv));break;}
    // Phase 5: recommendation gate
    case 'rec_gate':{
      ia.innerHTML=`<div class="ia-card"><span class="cat">How would you like to proceed?</span><div class="rec-gate">
        <button class="rec-btn" data-rv="1"><b>Show me IVY's recommendations</b><span>Duration-matched journeys for ${S.interest.toLowerCase()} travel</span></button>
        <button class="rec-btn" data-rv="0"><b>I'll choose my own destinations</b><span>I know what I want and will select myself</span></button>
      </div></div>`;
      ia.querySelectorAll('[data-rv]').forEach(b=>b.onclick=()=>submitStep(step,b.dataset.rv==='1',step.display(b.dataset.rv==='1')));break;}
    // Phase 6: duration + interest filtered route cards
    case 'route_cards':{
      const cats=INTEREST_CATS[S.interest]||[];
      const filtered=CURATED_ROUTES.filter(r=>{
        const meta=ROUTE_META[r.id];
        const fitDuration=!meta||meta.min<=S.customNights;
        const fitInterest=!cats.length||cats.includes(r.cat);
        return fitDuration&&fitInterest;
      });
      const list=filtered.length?filtered:CURATED_ROUTES.filter(r=>!ROUTE_META[r.id]||ROUTE_META[r.id].min<=S.customNights);
      ia.innerHTML=`<div class="ia-card"><span class="cat">Recommended journeys</span>
        <div class="route-cards">`+
        list.map(r=>{const m=ROUTE_META[r.id];return`<div class="route-card" data-rid="${r.id}">
          <div class="rc-cat">${r.cat}</div>
          <div class="rc-nm">${r.name}</div>
          <div class="rc-desc">${r.desc}</div>
          ${m?`<div class="rc-nights">Ideal: ${m.ideal} nights · Min: ${m.min} nights</div>`:''}
        </div>`;}).join('')+`</div></div>`;
      ia.querySelectorAll('.route-card').forEach(c=>c.onclick=()=>submitStep(step,c.dataset.rid,step.display(c.dataset.rid)));break;}
    // Phase 7: interest-filtered destination picker
    case 'dest_multi':{
      const allowed=(INTEREST_DESTS[S.interest]||Object.keys(DEST)).filter(k=>DEST[k]);
      let sel=[];
      const render=()=>{
        const warn=sel.length>1&&sel.length-1>S.customNights;
        ia.innerHTML=`<div class="ia-card"><span class="cat">${S.interest} destinations</span>
          <div class="dest-cards">`+
          allowed.map(k=>{const idx=sel.indexOf(k);return`<div class="dest-card ${idx>=0?'on':''}" data-dk="${k}">
            <div class="dc-nm">${DEST[k].name}</div>
            <div class="dc-rt">${FX[S.cur].s}${Math.round(DEST[k].base/FX[S.cur].r).toLocaleString()}/day</div>
            ${idx>=0?`<div class="dc-ord">Stop ${idx+1}</div>`:''}
          </div>`;}).join('')+`</div>`+
          (warn?`<div style="background:#FEF9EC;border:1px solid var(--gold);border-radius:6px;padding:8px;margin-top:8px;font-size:12.5px;color:#8B6B2A">Too many destinations for ${S.customNights} nights. Consider fewer stops or more nights.</div>`:'')+
          `<button class="ia-continue" id="iaDestOk" ${sel.length<1?'disabled':''}>Confirm ${sel.length} destination${sel.length!==1?'s':''}</button></div>`;
        ia.querySelectorAll('.dest-card').forEach(c=>c.onclick=()=>{const k=c.dataset.dk;const i=sel.indexOf(k);i<0?sel.push(k):sel.splice(i,1);render();});
        $('iaDestOk').onclick=()=>{if(!sel.length)return;submitStep(step,sel,step.display(sel));};};render();break;}
    // Nights allocation
    case 'nights_alloc':{
      // ALL dests get steppers — journey always departs from Delhi NCR, not the first destination
      let alloc={};S.dest.forEach(k=>{alloc[k]=1;});
      const render=()=>{
        const used=S.dest.reduce((a,k)=>a+(alloc[k]||0),0),ok=used===S.customNights;
        ia.innerHTML=`<div class="ia-card"><span class="cat">Night allocation</span>
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Departing from Delhi NCR · allocate nights across each destination</div>`+
          S.dest.map(k=>`<div class="alloc-row"><span style="font-weight:600;font-size:13.5px">${DEST[k]?DEST[k].name:k}</span>
            <div class="stepper" style="transform:scale(.88)"><button data-ak="${k}" data-d="-1">&#8722;</button><span>${alloc[k]||0}</span><button data-ak="${k}" data-d="1">&#43;</button></div></div>`).join('')+
          `<div style="font-size:12px;color:${ok?'#5A7A4A':'#B85C00'};padding:8px 0 4px">${used} of ${S.customNights} nights allocated</div>

        ia.querySelectorAll('[data-ak]').forEach(b=>b.onclick=()=>{const k=b.dataset.ak,d=+b.dataset.d;alloc[k]=Math.max(0,(alloc[k]||0)+d);render();});
        // +1 on first dest = the transit/arrival day; keeps compute() days=customNights+1 → nts=customNights
        $('iaAllocOk').onclick=()=>{if(used!==S.customNights)return;
          S.dest.forEach((k,i)=>{ S.nights[k]= i===0 ? (alloc[k]||0)+1 : (alloc[k]||0); });
          const disp=S.dest.map(k=>(DEST[k]?DEST[k].name:k)+': '+(alloc[k]||0)+'n').join(' · ');
          submitStep(step,alloc,disp);};};render();break;}
    // Blockers 1+3+4: city-by-city accommodation, live SerpAPI per city, no demo language
    case 'hotel':{
      const plan=cityNightPlan();
      let tier='none';const picks={};const live={};
      const fmtD=d=>d?d.toLocaleDateString([],{day:'numeric',month:'short'}):'';
      const fetchCity=async(c)=>{
        live[c.k]=null;render();
        const city=(DEST[c.k]?DEST[c.k].name:c.k).split(' &')[0];
        const ci=c.arr?c.arr.toISOString().split('T')[0]:'';

        const min={comfort:3,premium:4,luxury:5}[tier]||3;
        // Fallback: if date chain produced no dates, estimate from startDate+cumulative nights
        if(!ci||!co){
          const sd=S.startDate?new Date(S.startDate):new Date();
          let off=0;for(const dk of S.dest){if(dk===c.k)break;off+=(S.nights[dk]||1);}
          const arrFb=new Date(sd.getTime()+off*86400000);
          const depFb=new Date(arrFb.getTime()+((S.nights[c.k]||1))*86400000);
          ci=arrFb.toISOString().split('T')[0];co=depFb.toISOString().split('T')[0];}
        if(!LIVE_READY){
          live[c.k]=undefined;
          console.warn('[IVY hotels] APPS_SCRIPT_URL not configured — set it at the top of the file and paste the hotelsjson action into Code.gs then redeploy.');
          render();return;}
        try{
          const u=APPS_SCRIPT_URL+'?action=hotelsjson&city='+encodeURIComponent(city)+'&ci='+ci+'&co='+co;
          const d=await fetch(u).then(r=>r.json());
          if(!d.properties)throw new Error('hotelsjson action not found in Code.gs \u2014 paste the addition and redeploy');
          live[c.k]=(d.properties||[]).filter(p=>(p.extracted_hotel_class||0)>=min).slice(0,4)
            .map(p=>({name:p.name,stars:p.extracted_hotel_class||'',rating:p.overall_rating||'',area:p.area||city,
              nightly:(p.rate_per_night&&p.rate_per_night.extracted_lowest)||HOTELS[tier].n}));
        }catch(e){live[c.k]=undefined;console.warn('[IVY] Hotels:',e.message);}
        render();};
      const render=()=>{
        const pc=Object.keys(picks).length;
        ia.innerHTML=`<div class="ia-card"><span class="cat">Accommodation</span>
          <div class="qr-btns">`+
          Object.keys(HOTELS).map(hh=>`<button class="qr-btn ${tier===hh?'on':''}" data-ht="${hh}">${HOTELS[hh].l}</button>`).join('')+`</div>`+
          (tier!=='none'&&plan.length?plan.map(c=>{
            const pk=picks[c.k];const lv=live[c.k];
            return `<div class="city-hotel"><div class="chc-head"><b>${c.name}</b><span>${c.nights} night${c.nights>1?'s':''}${c.arr?' \u00b7 '+fmtD(c.arr)+' \u2013 '+fmtD(c.dep):''}</span></div>`+
              (pk?`<div class="hotel-row on"><b style="font-size:13.5px">${pk.name}</b>${pk.stars?' \u00b7 '+pk.stars+'&#9733;':''}${pk.rating?' \u00b7 '+pk.rating+' rated':''}<br><span style="color:var(--gold);font-size:12.5px">${fmt(pk.nightly)} per night</span></div>`:'')+
              (lv===null?'<p class="muted" style="font-size:12px;margin-top:6px">Checking live availability\u2026</p>':
               Array.isArray(lv)&&lv.length?lv.map((hh,i)=>`<div class="hotel-row ${pk&&pk.name===hh.name?'on':''}" data-ck="${c.k}" data-hi="${i}"><b style="font-size:13.5px">${hh.name}</b> \u00b7 ${hh.stars||''}&#9733;${hh.rating?' \u00b7 '+hh.rating+' rated':''} \u00b7 ${hh.area}<br><span style="color:var(--gold);font-size:12.5px">${fmt(hh.nightly)} per night</span></div>`).join(''):
               Array.isArray(lv)?'<p class="muted" style="font-size:12px;margin-top:6px">No live matches for these dates \u2014 your Journey Manager will share hand-picked options on WhatsApp.</p>':
               (pk?'':'<p class="muted" style="font-size:12px;margin-top:6px">Your Journey Manager will confirm live options for these dates within 2 hours of your enquiry.</p>'))+
            `</div>`;}).join('')+
            `<div class="hotel-notice">Hotel availability and rates change frequently. Final hotel confirmation must be completed at least 24 hours before your journey begins.</div>`:'')+
          `<button class="ia-continue" id="iaHotelOk" ${tier==='none'?'disabled':''}>Confirm accommodation${pc?' ('+pc+' propert'+(pc>1?'ies':'y')+' selected)':''}</button>
          <button class="ia-skip" id="iaHotelSkip">I'll arrange my own stays</button></div>`;
        ia.querySelectorAll('[data-ht]').forEach(b=>b.onclick=()=>{
          tier=b.dataset.ht;Object.keys(live).forEach(k=>delete live[k]);Object.keys(picks).forEach(k=>delete picks[k]);
          render();if(tier!=='none')plan.forEach(c=>fetchCity(c));});
        ia.querySelectorAll('[data-ck]').forEach(el=>el.onclick=()=>{const k=el.dataset.ck;const hh=(live[k]||[])[+el.dataset.hi];if(hh){picks[k]=hh;render();}});
        $('iaHotelOk').onclick=()=>{if(tier==='none')return;
          S.cityHotels={};Object.keys(picks).forEach(k=>{S.cityHotels[k]={name:picks[k].name,nightly:picks[k].nightly,stars:picks[k].stars,rating:picks[k].rating};});
          const firstPick=plan.length?picks[plan[0].k]:null;
          const lbl=HOTELS[tier].l+(pc?' \u00b7 '+pc+' propert'+(pc>1?'ies':'y')+' selected':'');
          submitStep(step,{tier,nightly:firstPick?firstPick.nightly:0,name:firstPick?firstPick.name:'',address:''},lbl);};
        $('iaHotelSkip').onclick=()=>{S.cityHotels={};submitStep(step,{tier:'none',nightly:0,name:'',address:''},'I\'ll arrange my own stays');};};
      render();break;}
    // Phase 10: vehicle after hotel
    case 'vehicle':{
      const rec=recVehicle();
      ia.innerHTML=`<div class="ia-card"><span class="cat">Transportation</span>`+
        Object.entries(VEH).map(([k,v])=>`<div class="veh-btn ${S.veh===k?'on':''}" data-vk="${k}">
          <div><div style="font-weight:600;font-size:14px">${v.l}</div><div style="font-size:12px;color:var(--muted)">&#8377;${v.r}/km &middot; ${v.g}</div></div>
          ${k===rec?`<span class="veh-tag">Recommended</span>`:''}
        </div>`).join('')+`</div>`;
      ia.querySelectorAll('[data-vk]').forEach(b=>b.onclick=()=>submitStep(step,b.dataset.vk,step.display(b.dataset.vk)));break;}
    // Phase 11: route-specific addons with participant count
    case 'addons':{
      const routeIds=ROUTE_ADDONS[S.selectedRouteId]||null;
      const expList=[];
      if(routeIds){routeIds.forEach(id=>{const e=findExp(id);if(e&&e.price>0)expList.push(e);});}
      else{const seen={};S.dest.forEach(k=>{const ex=DEST[k]&&DEST[k].exp;if(!ex||seen[ex])return;seen[ex]=1;(EXPER[ex]||[]).filter(e=>e.price>0).forEach(e=>expList.push(e));});}
      if(!expList.length){ia.innerHTML=`<div class="ia-card"><p class="muted" style="font-size:13px">No specific experiences available for this selection.</p><button class="ia-continue" id="iaSkip">Continue</button></div>`;$('iaSkip').onclick=()=>submitStep(step,{},step.display({}));return;}
      // S.addons[id] = participant count (0 = not selected)
      let sel={};expList.forEach(e=>{sel[e.id]=0;});
      const render=()=>{
        ia.innerHTML=`<div class="ia-card"><span class="cat">Experiences</span>`+
          expList.map(e=>{const on=sel[e.id]>0;const pax=sel[e.id]||S.adults;return`<div class="addon-row ${on?'on':''}" data-eid="${e.id}">
            <div class="ar-lbl">${e.label}</div>
            <div class="ar-price">${e.t==='pp'?FX[S.cur].s+Math.round(e.price/FX[S.cur].r).toLocaleString()+' per person':''+FX[S.cur].s+Math.round(e.price/FX[S.cur].r).toLocaleString()+' per group'}</div>
            ${on&&e.t==='pp'?`<div class="pax-sel">
              <span>Participants:</span>
              <div class="stepper" style="transform:scale(.8)"><button data-pid="${e.id}" data-d="-1">&#8722;</button><span>${pax}</span><button data-pid="${e.id}" data-d="1">&#43;</button></div>
              <span style="font-size:11px;color:var(--gold)">${FX[S.cur].s}${Math.round(e.price*pax/FX[S.cur].r).toLocaleString()}</span>
            </div>`:''}
          </div>`;}).join('')+
          `<button class="ia-continue" id="iaAddOk">Add selected</button>
          <button class="ia-skip" id="iaAddSkip">Continue without</button></div>`;
        expList.forEach(e=>{const el=ia.querySelector(`[data-eid="${e.id}"]`);if(el)el.onclick=(ev)=>{if(ev.target.closest('[data-pid]'))return;sel[e.id]=sel[e.id]>0?0:S.adults;render();};});
        ia.querySelectorAll('[data-pid]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();const id=b.dataset.pid,d=+b.dataset.d;sel[id]=Math.max(1,Math.min(S.adults,(sel[id]||S.adults)+d));render();});
        $('iaAddOk').onclick=()=>submitStep(step,Object.fromEntries(Object.entries(sel).filter(([,v])=>v>0)),step.display(sel));
        $('iaAddSkip').onclick=()=>submitStep(step,{},step.display({}));};render();break;}
  }
}

function submitStep(step,raw,display){
  if(step.validate&&!step.validate(raw))return;
  if(step.onAnswer)step.onAnswer(raw);IA().innerHTML='';
  const txt=typeof display==='string'?display:typeof display==='object'&&display.label?display.label:JSON.stringify(display);
  addUser(txt);setTimeout(nextStep,350);}

async function doPay(){
  const q=compute();const commit=Math.round(q.total*0.10);
  if(DEMO||!APPS_SCRIPT_URL||APPS_SCRIPT_URL.indexOf('PASTE_')===0){
    IA().innerHTML='';
    addBot('Thank you'+(S.name?', '+S.name.split(' ')[0]:'')+'. Your Journey Manager will send a secure Razorpay payment link of <b>'+fmt(commit)+'</b> to your WhatsApp within 2 hours to confirm your journey.');
    console.warn('[IVY] Razorpay blocked: APPS_SCRIPT_URL not configured');return;}
  try{const r=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},

    if(!r.success){alert(r.error||'Unable to initiate payment.');return;}
    const rz=new Razorpay({key:r.key_id,order_id:r.order_id,amount:r.amount,currency:r.currency,
      name:'Ivory Arc Travels',description:'Journey commitment — 10%',
      handler:function(resp){fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain'},
        body:JSON.stringify(Object.assign({action:'verifyPayment',estimateRef:S.ref,amountInr:commit},resp))})
        .then(x=>x.json()).then(v=>{IA().innerHTML='';addBot(v.success?
          'Your journey is confirmed. Reference: <b>'+(v.booking_reference||S.ref)+'</b>. Your Journey Manager will be in touch within two hours.':
          'Payment verification failed — please contact hello@ivoryarctravels.com.');});},
      prefill:{name:S.name,email:S.email,contact:S.phone},theme:{color:'#C9A84C'}});
    rz.open();}catch(e){alert('Payment error: '+e.message);}}

/* ======================== PDF — luxury proposal (Phase 14) */
function generatePDF(){
