<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivory Arc Travels – Header</title>

  <!-- Google Fonts: Cinzel (luxury display) + Cormorant Garamond (elegant body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black:       #0a0a0a;
      --ivory:       #f5f0e8;
      --gold:        #c9a84c;
      --gold-light:  #e2c06e;
      --gold-dim:    #a0783a;
      --white:       #ffffff;
    }

    body {
      background: #1a1a1a;
      font-family: 'Cormorant Garamond', serif;
    }

    /* ─── HEADER SHELL ─────────────────────────────────────────────── */
    header {
      background: var(--black);
      width: 100%;
      padding: 18px 0 14px;
      border-bottom: 1px solid rgba(201, 168, 76, 0.35);
      position: relative;
    }

    /* subtle gold shimmer line at very top */
    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--gold-dim) 20%,
        var(--gold-light) 50%,
        var(--gold-dim) 80%,
        transparent 100%
      );
    }

    /* ─── INNER WRAPPER ─────────────────────────────────────────────── */
    .header-inner {
      display: flex;
      align-items: center;
      width: 100%;
      /* 5% left padding | 30% logo | gap | 60% right | 5% right padding */
      padding: 0 5%;
    }

    /* ─── LEFT: LOGO BLOCK (30% of total width) ─────────────────────── */
    .logo-block {
      width: 30%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-right: 24px;
    }

    .logo-block img {
      max-height: 90px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
      /* slight drop shadow to lift logo off black */
      filter: drop-shadow(0 2px 8px rgba(201, 168, 76, 0.18));
    }

    /* ─── RIGHT: INFO BLOCK (60% of total width) ─────────────────────── */
    .info-block {
      width: 60%;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    /* ── Operating since ── */
    .operating-since {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: var(--ivory);
      text-transform: uppercase;
      opacity: 0.88;
    }

    /* ── Trusted line ── */
    .trusted-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .trusted-label {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.22em;
      color: var(--ivory);
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0.75;
    }

    /* partner logos container */
    .partner-logos {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .partner-logos img {
      height: 28px;
      width: auto;
      object-fit: contain;
      /* keep them visible on dark bg: remove dark backgrounds from screenshots */
      border-radius: 4px;
      filter: brightness(1.05) contrast(1.05);
      transition: filter 0.2s ease;
    }

    .partner-logos img:hover {
      filter: brightness(1.2) contrast(1.1);
    }

    /* ── Certifications strip ── */
    .cert-strip {
      font-family: 'Cinzel', serif;
      font-weight: 500;
      font-size: 10.5px;
      letter-spacing: 0.25em;
      color: var(--gold);
      text-transform: uppercase;
      white-space: nowrap;
      /* subtle glow */
      text-shadow:
        0 0 12px rgba(201, 168, 76, 0.45),
        0 0 24px rgba(201, 168, 76, 0.15);
    }

    /* ─── DECORATIVE DIVIDER between logo & info ─────────────────────── */
    .divider {
      flex-shrink: 0;
      /* remaining 10% is the gap/padding between the two blocks */
      /* already handled by the 5%+30%+60%+5% = 100% math; 
         this element takes visual space as a thin gold vertical rule */
      width: 1px;
      height: 70px;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(201, 168, 76, 0.4) 30%,
        rgba(201, 168, 76, 0.4) 70%,
        transparent 100%
      );
      margin: 0 auto;
      /* centers itself in the 10% gap area */
      flex: 1 0 0;
      max-width: 60px;
    }

    /* ─── RESPONSIVE: tablet ────────────────────────────────────────── */
    @media (max-width: 900px) {
      .header-inner {
        padding: 0 4%;
      }
      .logo-block img  { max-height: 70px; }
      .cert-strip      { font-size: 9px; letter-spacing: 0.18em; }
      .partner-logos img { height: 22px; }
      .trusted-label   { font-size: 10px; }
    }

    /* ─── RESPONSIVE: mobile ────────────────────────────────────────── */
    @media (max-width: 600px) {
      header { padding: 14px 0 12px; }

      .header-inner {
        flex-direction: column;
        align-items: center;
        padding: 0 5%;
        gap: 14px;
      }
      .divider { display: none; }
      .logo-block {
        width: 100%;
        justify-content: center;
        padding: 0;
      }
      .logo-block img { max-height: 65px; }
      .info-block {
        width: 100%;
        align-items: center;
        gap: 8px;
      }
      .cert-strip {
        font-size: 9px;
        letter-spacing: 0.15em;
        text-align: center;
        white-space: normal;
      }
      .trusted-row { flex-wrap: wrap; justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">

      <!-- ── LEFT: LOGO ─────────────────────────────────────────────── -->
      <div class="logo-block">
        <img
          src="https://ivoryarctravels.com/wp-content/uploads/2026/05/ChatGPT-Image-Jan-10-2026-09_54_20-AM-1.png"
          alt="Ivory Arc Travels"
        />
      </div>

      <!-- ── CENTRE: VERTICAL RULE (occupies the 10% gap) ──────────── -->
      <div class="divider"></div>

      <!-- ── RIGHT: INFO ────────────────────────────────────────────── -->
      <div class="info-block">

        <span class="operating-since">Operating since 2019</span>

        <div class="trusted-row">
          <span class="trusted-label">Trusted &amp; Verified By</span>
          <div class="partner-logos">
            <img
              src="https://ivoryarctravels.com/wp-content/uploads/2026/05/Screenshot-2026-05-28-at-10.54.26-AM.png"
              alt="Google"
            />
            <img
              src="https://ivoryarctravels.com/wp-content/uploads/2026/05/Screenshot-2026-05-28-at-10.56.00-AM.png"
              alt="TripAdvisor"
            />
            <img
              src="https://ivoryarctravels.com/wp-content/uploads/2026/05/Screenshot-2026-05-28-at-10.57.24-AM.png"
              alt="Viator"
            />
          </div>
        </div>

        <span class="cert-strip">
          GST Registered &nbsp;·&nbsp; MSME Certified &nbsp;·&nbsp; Govt. of India Recognised
        </span>

      </div>
      <!-- /info-block -->

    </div>
  </header>

</body>
</html>
